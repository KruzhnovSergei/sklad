<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Готовый компьютер — Bestcomp, Бишкек</title>
<meta name="description" content="Готовый компьютер в наличии в Bestcomp, Бишкек: фото, состав и цена.">
<link rel="icon" href="../favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700&family=Manrope:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="site.css">
</head>
<body>
<header class="top">
  <div class="wrap">
    <a class="logo" href="index.html">
      <i><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#14161A" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="5" width="14" height="14" rx="2"/><rect x="9" y="9" width="6" height="6"/><path d="M9 2v3M15 2v3M9 19v3M15 19v3M2 9h3M2 15h3M19 9h3M19 15h3"/></svg></i>
      <b>BESTCOMP</b>
    </a>
    <nav class="nav" aria-label="Основное меню">
      <a href="catalog.html">Каталог</a>
      <a href="builds.html">Готовые ПК</a>
      <a href="index.html#build">Сборка ПК</a>
      <a href="index.html#buyback">Скупка</a>
      <a href="index.html#contacts">Контакты</a>
    </nav>
    <a class="btn btn-accent" href="tel:+996707198806">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1.9.4 1.8.7 2.7a2 2 0 0 1-.5 2.1L8 9.8a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.7.7a2 2 0 0 1 1.7 2z"/></svg>
      <span class="lbl">+996 707 198 806</span>
    </a>
  </div>
</header>
<script>
// Отступ под закреплённую шапку: при переходе по #разделу заголовок не прячется под ней
(function(){const h=document.querySelector('.top');if(!h)return;
  const set=()=>document.documentElement.style.setProperty('--hh',(h.offsetHeight+16)+'px');set();addEventListener('resize',set);
  // когда блоки догрузились (готовые сборки), докрутить до раздела из адреса ещё раз
  window.bcFixHash=()=>{const id=decodeURIComponent(location.hash.slice(1));if(!id||id.includes('='))return;const el=document.getElementById(id);if(el)el.scrollIntoView({behavior:'auto'})};
  addEventListener('load',()=>setTimeout(bcFixHash,50));})();
</script>


<main class="wrap" style="padding-top:28px;padding-bottom:96px">
  <a class="back" href="builds.html">← Все готовые компьютеры</a>
  <div id="pc"><p style="color:var(--muted)">Загружаю…</p></div>
</main>
<footer class="foot">
  <div class="wrap">
    <span>© 2026 Bestcomp · ИП Кружнов С.В.</span>
    <span>Бишкек, ул. Сыдыкова 178 · Пн–Сб 10:00–20:00 · +996 707 198 806</span>
    <span id="siteStats" class="stats" hidden></span>
  </div>
</footer>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="../config.js"></script>
<script src="pcs.js"></script>
<script>
(async()=>{const box=document.getElementById('pc');const sn=new URLSearchParams(location.search).get('sn')||'';
  const {esc,money,buy,kind,ph}=BCPC;let L=[];try{L=await BCPC.load()}catch(e){}
  const x=L.find(r=>r.sn===sn);
  if(!x){box.innerHTML='<h1 style="font-family:var(--f-display);font-size:28px">Этот компьютер уже продан</h1><p style="color:var(--muted);font-size:17px">Посмотрите другие готовые сборки или напишите нам — соберём похожий.</p><div class="row" style="margin-top:16px"><a class="btn btn-dark btn-lg" href="builds.html">Готовые компьютеры</a><a class="btn btn-accent btn-lg" href="https://wa.me/996707198806">Написать в WhatsApp</a></div>';return}
  document.title=x.n+' — Bestcomp, Бишкек';
  let imgs=[];try{const d=await BCPC.photos(sn);imgs=(d&&d.imgs)||[]}catch(e){}
  if(!imgs.length&&x.th)imgs=[x.th];
  box.innerHTML=`<div class="pcd">
    <div class="pcd-gal"><div class="pcd-main" id="main">${imgs[0]?`<img src="${imgs[0]}" alt="${esc(x.n)}">`:ph}</div>
      ${imgs.length>1?`<div class="pcd-thumbs">${imgs.map((s,i)=>`<button data-i="${i}" aria-pressed="${i===0}" aria-label="Фото ${i+1}"><img src="${s}" alt=""></button>`).join('')}</div>`:''}</div>
    <div class="pcd-info">
      <div class="row" style="gap:8px;align-items:center"><span class="pc-kind" style="position:static">${kind(x)}</span><span style="color:#6B717A;font-size:14px">S/N ${esc(x.sn)}</span><span class="instock" style="margin:0">В наличии</span></div>
      <h1>${esc(x.n)}</h1>
      ${x.cfg?`<p class="pc-cfg" style="font-size:18px">${esc(x.cfg)}</p>`:''}
      <div class="pcd-price">${money(x.p)}</div>
      <div class="row"><a class="btn btn-accent btn-lg" target="_blank" rel="noopener" href="${buy(x)}">Купить в WhatsApp</a><a class="btn btn-line btn-lg" href="tel:+996707198806">Позвонить</a></div>
      ${x.desc?`<p class="pcd-desc">${esc(x.desc)}</p>`:''}
      ${(x.parts||[]).length?`<div class="pcd-parts"><h2>Комплектующие</h2><ul>${x.parts.map(p=>`<li>${esc(p)}</li>`).join('')}</ul></div>`:''}
      <p style="margin:0;color:var(--muted);font-size:15px">Забрать можно в магазине: Бишкек, ул. Сыдыкова 178, Пн–Сб 10:00–20:00.</p>
    </div></div>`;
  box.addEventListener('click',e=>{const b=e.target.closest('.pcd-thumbs button');if(!b)return;const i=+b.dataset.i;
    document.getElementById('main').innerHTML=`<img src="${imgs[i]}" alt="${esc(x.n)}">`;box.querySelectorAll('.pcd-thumbs button').forEach(t=>t.setAttribute('aria-pressed',t===b))});
})();
</script>
<script src="stats.js"></script>
</body>
</html>
