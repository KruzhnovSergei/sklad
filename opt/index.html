<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Оптовый каталог</title>
<link rel="icon" href="../favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Unbounded:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#14161A;--ink2:#3A3F47;--muted:#5B616A;--paper:#F3F2EE;--paper2:#E9E7E1;--card:#fff;--line:#E2E0DA;--accent:#F5B700;--ok:#1E7A46;--okbg:#E4F3EA;--low:#B4600B;--lowbg:#FCEFD9;--no:#7A7F87;--nobg:#ECEBE7;--bad:#B3261E;
  --f-d:'Unbounded',system-ui,sans-serif;--f-b:'Manrope',system-ui,-apple-system,'Segoe UI',sans-serif;color-scheme:light}
*{box-sizing:border-box}[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.45 var(--f-b)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:inherit}
.wrap{max-width:1180px;margin:0 auto;padding:0 16px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 18px;border-radius:10px;border:1.5px solid transparent;font-weight:700;background:var(--ink);color:#fff;text-decoration:none;white-space:nowrap}
.btn:disabled{opacity:.5;cursor:default}
.btn.acc{background:var(--accent);color:var(--ink)}
.btn.line{background:transparent;border-color:var(--line);color:var(--ink)}
.btn.sm{min-height:36px;padding:0 12px;font-size:14px;border-radius:8px}
.btn.wa{background:#1FA855;color:#fff}
input,select,textarea{width:100%;min-height:44px;padding:9px 12px;border:1.5px solid var(--line);border-radius:10px;background:#fff;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--ink)}
textarea{min-height:72px;resize:vertical}
label.f{display:flex;flex-direction:column;gap:5px;font-size:13px;font-weight:600;color:var(--muted)}
/* login */
.login{min-height:100vh;display:grid;place-items:center;padding:24px 16px;background:var(--ink)}
.login .card{width:100%;max-width:380px;background:var(--card);border-radius:18px;padding:28px 24px;display:flex;flex-direction:column;gap:14px}
.login h1{font:700 22px/1.2 var(--f-d);margin:0}
.login p{margin:0;color:var(--muted);font-size:14px}
.logo{display:flex;align-items:center;gap:10px}
.logo i{width:34px;height:34px;border-radius:8px;background:var(--accent);display:grid;place-items:center;flex:none}
.logo i svg{width:20px;height:20px}
.err{color:var(--bad);font-size:14px;min-height:20px;margin:0}
/* header */
.top{position:sticky;top:0;z-index:30;background:var(--ink);color:#fff}
.top .wrap{display:flex;align-items:center;gap:12px;min-height:60px;padding-top:8px;padding-bottom:8px}
.top .logo b{font:700 16px/1.15 var(--f-d)}
.top .logo small{display:block;font:500 12px var(--f-b);color:#C9CCD1;margin-top:2px}
.top .sp{flex:1}
.cartbtn{position:relative;background:var(--accent);color:var(--ink);min-height:42px}
.cartbtn .n{background:var(--ink);color:#fff;border-radius:9px;font-size:12px;padding:1px 7px;min-width:20px}
.out{background:none;border:0;color:#C9CCD1;font-size:13px;text-decoration:underline;padding:4px}
/* toolbar */
.bar{position:sticky;top:60px;z-index:20;background:var(--paper);border-bottom:1px solid var(--line)}
.bar .wrap{display:flex;flex-wrap:wrap;gap:8px;padding-top:10px;padding-bottom:10px;align-items:center}
.bar .q{flex:1 1 260px}
.bar select{flex:0 1 220px;width:auto}
.chk{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:600;white-space:nowrap}
.chk input{width:18px;height:18px;min-height:0}
.head{padding:18px 0 6px}
.head h1{font:700 clamp(20px,3vw,28px)/1.15 var(--f-d);margin:0}
.head p{margin:6px 0 0;color:var(--muted);font-size:14px}
.head .note{margin-top:8px;padding:8px 12px;border-radius:10px;background:var(--lowbg);color:#6B3A00;font-weight:600;font-size:14px;display:inline-block}
/* groups / rows */
.grp{margin:18px 0 0}
.grp h2{font:700 15px/1.2 var(--f-b);text-transform:uppercase;letter-spacing:.04em;margin:0;padding:10px 14px;background:var(--ink);color:#fff;border-radius:12px 12px 0 0;display:flex;justify-content:space-between;gap:8px}
.grp h2 span{font-weight:600;color:#C9CCD1;text-transform:none;letter-spacing:0}
.grp.kits h2{background:#B4600B}
.list{background:var(--card);border:1px solid var(--line);border-top:0;border-radius:0 0 12px 12px;overflow:hidden}
.it{display:grid;grid-template-columns:64px 1fr auto;gap:12px;align-items:center;padding:10px 14px;border-top:1px solid var(--line)}
.it:first-child{border-top:0}
.th{width:64px;height:64px;border-radius:8px;background:var(--paper);border:1px solid var(--line);display:grid;place-items:center;overflow:hidden;padding:0;cursor:default}
.th.has{cursor:pointer}
.th img{width:100%;height:100%;object-fit:contain;background:#fff}
.th svg{width:26px;height:26px;color:#B9B6AE}
.nm{min-width:0}
.nm .t{font-weight:700;line-height:1.3;word-break:break-word}
.nm .t.lnk{cursor:pointer}
.nm .t.lnk:hover{text-decoration:underline}
.nm .m{display:flex;flex-wrap:wrap;gap:6px 10px;margin-top:4px;font-size:13px;color:var(--muted);align-items:center}
.nm .nt{color:#8A4B00;font-weight:600}
.pill{display:inline-block;padding:2px 8px;border-radius:999px;font-size:12px;font-weight:700}
.s2{background:var(--okbg);color:var(--ok)}.s1{background:var(--lowbg);color:var(--low)}.s0{background:var(--nobg);color:var(--no)}
.new{background:#E4F5EA;color:#14653A}
.more{font-size:13px;font-weight:700;text-decoration:underline;background:none;border:0;padding:0;color:var(--ink2)}
.rt{display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.pr{font:800 18px/1 var(--f-b);white-space:nowrap}
.pr small{font-size:13px;font-weight:600;color:var(--muted)}
.sep{font-size:12px;color:var(--muted);text-decoration:line-through}
.step{display:inline-flex;align-items:center;border:1.5px solid var(--ink);border-radius:9px;overflow:hidden;height:36px}
.step button{width:34px;height:100%;border:0;background:#fff;font-size:18px;font-weight:700}
.step input{width:46px;min-height:0;height:100%;border:0;border-radius:0;text-align:center;padding:0;font-weight:700}
.add{min-height:36px;padding:0 14px;font-size:14px;border-radius:9px}
.empty{padding:40px 16px;text-align:center;color:var(--muted)}
.foot{padding:28px 0 120px;color:var(--muted);font-size:13px}
.kcomp{margin:4px 0 0;padding-left:16px;font-size:13px;color:var(--ink2)}
/* drawer & modal */
.ov{position:fixed;inset:0;background:rgb(20 22 26 / .55);z-index:50;display:flex;justify-content:flex-end}
.drawer{width:min(460px,100%);height:100%;background:var(--paper);display:flex;flex-direction:column}
.dh{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;background:var(--ink);color:#fff}
.dh h2{font:700 18px var(--f-d);margin:0}
.x{background:none;border:0;color:inherit;font-size:28px;line-height:1;width:40px;height:40px}
.db{flex:1;overflow:auto;padding:12px 16px;display:flex;flex-direction:column;gap:10px}
.cl{background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 12px;display:grid;grid-template-columns:1fr auto;gap:6px 10px;align-items:center}
.cl .t{font-weight:700;font-size:14px;line-height:1.3}
.cl .u{font-size:13px;color:var(--muted)}
.cl .s{font-weight:800;text-align:right}
.cl .rm{background:none;border:0;color:var(--bad);font-size:13px;text-decoration:underline;padding:0;justify-self:start}
.df{border-top:1px solid var(--line);padding:12px 16px calc(12px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:10px;background:var(--card)}
.of{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px 12px;display:flex;flex-direction:column;gap:12px;margin-top:4px}
.of h3{margin:0;font:700 16px var(--f-b)}
.fe{color:var(--bad);font-size:12.5px;font-weight:600;min-height:0}
.fe:empty{display:none}
input.inv{border-color:var(--bad)}
.hint{margin:0;padding:10px 12px;border-radius:10px;background:var(--okbg);color:var(--ok);font-size:13.5px;font-weight:600;line-height:1.4}
.df .err:empty{display:none}
.tot{display:flex;justify-content:space-between;align-items:baseline;font-weight:800;font-size:20px}
.ok{background:var(--okbg);color:var(--ok);border-radius:12px;padding:16px;font-weight:600}
.md{position:fixed;inset:0;z-index:60;background:rgb(20 22 26 / .7);display:grid;place-items:center;padding:16px}
.mdc{background:var(--card);border-radius:16px;width:min(860px,100%);max-height:calc(100vh - 32px);overflow:auto;display:grid;grid-template-columns:1.1fr 1fr}
.gal{background:#fff;border-right:1px solid var(--line);padding:16px;display:flex;flex-direction:column;gap:10px}
.gal .big{aspect-ratio:1/1;display:grid;place-items:center;border-radius:12px;background:#fff;overflow:hidden}
.gal .big img{max-width:100%;max-height:100%;object-fit:contain}
.gal .sm{display:flex;gap:8px;flex-wrap:wrap}
.gal .sm button{width:62px;height:62px;padding:0;border:2px solid var(--line);border-radius:8px;background:#fff;overflow:hidden}
.gal .sm button[aria-current=true]{border-color:var(--ink)}
.gal .sm img{width:100%;height:100%;object-fit:contain}
.inf{padding:18px;display:flex;flex-direction:column;gap:12px;position:relative}
.inf h3{font:700 19px/1.3 var(--f-b);margin:0;padding-right:36px}
.inf .x{position:absolute;right:8px;top:8px;color:var(--ink)}
.desc{white-space:pre-wrap;font-size:15px;line-height:1.55;color:var(--ink2)}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:10px;z-index:80;font-weight:600;font-size:14px;max-width:calc(100% - 32px)}
.fab{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom));z-index:25;box-shadow:0 8px 24px rgb(0 0 0 / .25)}
@media (max-width:720px){
  .top .logo small{display:none}
  .bar{top:60px}
  .bar select{flex:1 1 140px}
  .it{grid-template-columns:52px 1fr;gap:10px}
  .th{width:52px;height:52px}
  .rt{grid-column:1 / -1;flex-direction:row;justify-content:space-between;align-items:center}
  .mdc{grid-template-columns:1fr}
  .gal{border-right:0;border-bottom:1px solid var(--line)}
}
</style>
</head>
<body>
<div id="app"><div class="login"><div class="card"><p>Загрузка…</p></div></div></div>
<div id="toast" class="toast" hidden></div>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="../config.js"></script>
<script>
(function(){
const $=s=>document.querySelector(s);
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const NF=new Intl.NumberFormat('ru-RU',{maximumFractionDigits:2});
const money=v=>NF.format(Math.round(Number(v)||0))+' сом';
const LS={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}},del(k){try{localStorage.removeItem(k)}catch(e){}}};
const ICO_BOX='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M3 8l9-5 9 5v8l-9 5-9-5z"/><path d="M3 8l9 5 9-5M12 13v8"/></svg>';
const LOGO='<i><svg viewBox="0 0 24 24" fill="none" stroke="#14161A" stroke-width="2" aria-hidden="true"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 7h8M8 11h8M8 15h5"/></svg></i>';
let db=null;
try{firebase.initializeApp(window.SK_CONFIG.firebase);db=firebase.firestore()}catch(e){}
const S={key:LS.get('opt_key',null),meta:null,rows:[],q:'',g:'',sort:'',only:false,cart:[],th:{},open:null,cartOpen:false,sent:null,me:LS.get('opt_me',{name:'',phone:''})};
function toast(t){const e=$('#toast');e.textContent=t;e.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>e.hidden=true,2600)}
async function sha(t){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(t));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}
const keyOf=(l,p)=>sha('bestcomp-opt\n'+String(l).trim().toLowerCase()+'\n'+String(p));

/* ---------- вход ---------- */
function loginView(msg){document.title='Оптовый каталог — вход';
  $('#app').innerHTML=`<div class="login"><form class="card" id="lf" autocomplete="on"><div class="logo">${LOGO}<h1>Оптовый каталог</h1></div><p>Для дилеров. Логин и пароль — в нашей группе дилеров.</p>
  <label class="f">Логин<input id="lu" name="username" autocomplete="username" required></label>
  <label class="f">Пароль<input id="lp" name="password" type="password" autocomplete="current-password" required></label>
  <p class="err" id="le">${esc(msg||'')}</p><button class="btn acc" id="lb" type="submit">Войти</button></form></div>`;
  $('#lf').addEventListener('submit',async e=>{e.preventDefault();const b=$('#lb');b.disabled=true;b.textContent='Проверяю…';$('#le').textContent='';
    try{const k=await keyOf($('#lu').value,$('#lp').value);const ok=await load(k);if(ok){S.key=k;LS.set('opt_key',k);main()}else{$('#le').textContent='Неверный логин или пароль';b.disabled=false;b.textContent='Войти'}}
    catch(err){$('#le').textContent='Нет связи. Проверьте интернет и попробуйте ещё раз';b.disabled=false;b.textContent='Войти'}});
  setTimeout(()=>$('#lu')?.focus(),50)}
async function load(k){if(!db)throw new Error('db');const m=await db.doc(`optcat/${k}_m`).get();if(!m.exists)return false;const meta=m.data();const rows=[];
  const parts=await Promise.all(Array.from({length:Number(meta.chunks)||0},(_,i)=>db.doc(`optcat/${k}_${i}`).get()));for(const d of parts)if(d.exists)rows.push(...(d.data().rows||[]));
  S.meta=meta;S.rows=rows;if(!S.sort)S.sort=meta.sort||'price';return true}

/* ---------- каталог ---------- */
const cartKey=()=>'opt_cart_'+String(S.key).slice(0,12);
function cartLoad(){const c=LS.get(cartKey(),[]);const R={};for(const r of S.rows)R['i'+r.i]=r;for(const k of S.meta.kits||[])R['k'+k.k]=k;
  S.cart=c.map(x=>{const r=R[x.id];return r?{id:x.id,q:x.q,n:r.n,p:r.p}:null}).filter(Boolean)}
function cartSave(){LS.set(cartKey(),S.cart.map(x=>({id:x.id,q:x.q})))}
const inCart=id=>S.cart.find(x=>x.id===id);
function setQty(id,q,r){q=Math.max(0,Math.floor(Number(q)||0));const c=inCart(id);if(!q){S.cart=S.cart.filter(x=>x.id!==id)}else if(c)c.q=q;else S.cart.push({id,q,n:r.n,p:r.p});cartSave();updCart()}
const cartTot=()=>S.cart.reduce((a,x)=>a+x.p*x.q,0);
function updCart(){const n=S.cart.reduce((a,x)=>a+x.q,0);for(const e of document.querySelectorAll('[data-cartn]'))e.textContent=n;for(const e of document.querySelectorAll('[data-cartsum]'))e.textContent=money(cartTot());
  const f=$('#fab');if(f)f.hidden=!S.cart.length;
  for(const e of document.querySelectorAll('[data-ctl]'))e.innerHTML=ctlHtml(e.dataset.ctl);
  if(S.cartOpen)drawer()}
function ctlHtml(id){const c=inCart(id);return c?`<span class="step"><button data-q="-1" data-id="${esc(id)}" aria-label="Меньше">−</button><input inputmode="numeric" value="${c.q}" data-qi="${esc(id)}" aria-label="Количество"><button data-q="1" data-id="${esc(id)}" aria-label="Больше">+</button></span>`:`<button class="btn add" data-add="${esc(id)}">В корзину</button>`}
function stPill(r){if(!S.meta.st||r.s==null)return '';return `<span class="pill s${r.t}">${esc(r.s)}</span>`}
function filtered(){const ws=S.q.trim().toLowerCase().split(/\s+/).filter(Boolean);
  let L=S.rows.filter(r=>(!S.g||r.g===S.g)&&(!S.only||r.t>0||r.t==null)&&(!ws.length||ws.every(w=>(r.n+' '+r.g+' '+(r.nt||'')).toLowerCase().includes(w))));
  const sk=S.sort;L.sort((a,b)=>a.g.localeCompare(b.g,'ru')||(sk==='desc'?b.p-a.p:sk==='name'?0:a.p-b.p)||a.n.localeCompare(b.n,'ru'));return L}
function itemHtml(r){const id='i'+r.i;const ph=r.ph>0;const det=ph||r.d;
  return `<div class="it"><button class="th${ph?' has':''}" ${ph?`data-open="${esc(r.i)}" aria-label="Фото"`:'tabindex="-1" aria-hidden="true"'}>${ph?`<img data-th="${esc(r.i)}" alt="" ${S.th[r.i]?`src="${S.th[r.i]}"`:''}>`:ICO_BOX}</button>
   <div class="nm"><div class="t${det?' lnk':''}" ${det?`data-open="${esc(r.i)}"`:''}>${esc(r.n)}</div><div class="m">${r.nw?'<span class="pill new">★ новинка</span>':''}${stPill(r)}${r.w?`<span>гарантия ${esc(r.w)}</span>`:''}${r.nt?`<span class="nt">${esc(r.nt)}</span>`:''}${det?`<button class="more" data-open="${esc(r.i)}">${ph?'Фото':''}${ph&&r.d?' и описание':r.d?'Описание':''}</button>`:''}</div></div>
   <div class="rt"><div class="pr">${NF.format(r.p)} <small>сом</small></div><div data-ctl="${esc(id)}">${ctlHtml(id)}</div></div></div>`}
function kitHtml(k){const id='k'+k.k;return `<div class="it"><div class="th" aria-hidden="true">${ICO_BOX}</div><div class="nm"><div class="t">${esc(k.n)}</div><ul class="kcomp">${(k.c||[]).map(c=>`<li>${esc(c)}</li>`).join('')}</ul><div class="m">${stPill(k)}${k.nt?`<span class="nt">${esc(k.nt)}</span>`:''}</div></div>
  <div class="rt"><div class="pr">${NF.format(k.p)} <small>сом</small></div>${k.sep>k.p?`<div class="sep">${NF.format(k.sep)} сом по отдельности</div>`:''}<div data-ctl="${esc(id)}">${ctlHtml(id)}</div></div></div>`}
function listHtml(){const L=filtered();const kits=(S.meta.kits||[]).filter(k=>!S.g&&(!S.only||k.t>0||k.t==null)&&(!S.q.trim()||S.q.trim().toLowerCase().split(/\s+/).every(w=>(k.n+' '+(k.c||[]).join(' ')).toLowerCase().includes(w))));
  if(!L.length&&!kits.length)return '<div class="empty">Ничего не найдено. Попробуйте другое слово или уберите фильтр.</div>';
  let out='';if(kits.length)out+=`<section class="grp kits"><h2>Комплекты <span>${kits.length} шт.</span></h2><div class="list">${kits.map(kitHtml).join('')}</div></section>`;
  let cur=null,buf=[];const flush=()=>{if(cur!=null)out+=`<section class="grp"><h2>${esc(cur)} <span>${buf.length} поз.</span></h2><div class="list">${buf.map(itemHtml).join('')}</div></section>`};
  for(const r of L){if(r.g!==cur){flush();cur=r.g;buf=[]}buf.push(r)}flush();return out}
function main(){cartLoad();const m=S.meta;document.title=(m.shop?m.shop+' — ':'')+'оптовый каталог';
  const groups=[...new Set(S.rows.map(r=>r.g))].sort((a,b)=>a.localeCompare(b,'ru'));
  $('#app').innerHTML=`<header class="top"><div class="wrap"><div class="logo">${LOGO}<div><b>${esc(m.shop||'Оптовый каталог')}</b><small>Оптовый каталог · обновлён ${esc(fmtDt(m.at))}</small></div></div><span class="sp"></span>
   <button class="btn cartbtn" data-cart="1">Корзина <span class="n" data-cartn>0</span></button><button class="out" data-out="1">Выйти</button></div></header>
   <div class="bar"><div class="wrap"><input class="q" id="q" type="search" placeholder="Поиск: название, модель…" value="${esc(S.q)}" autocomplete="off">
    <select id="g" aria-label="Группа"><option value="">Все группы (${S.rows.length})</option>${groups.map(g=>`<option${g===S.g?' selected':''}>${esc(g)}</option>`).join('')}</select>
    <select id="srt" aria-label="Порядок"><option value="price"${S.sort==='price'?' selected':''}>Сначала дешевле</option><option value="desc"${S.sort==='desc'?' selected':''}>Сначала дороже</option><option value="name"${S.sort==='name'?' selected':''}>По названию</option></select>
    ${m.st?`<label class="chk"><input type="checkbox" id="only"${S.only?' checked':''}> Только в наличии</label>`:''}</div></div>
   <main class="wrap"><div class="head"><h1>${esc(m.title||'Прайс-лист')}</h1><p>${(m.contact||[]).map(esc).join(' · ')}</p>${m.note?`<div class="note">${esc(m.note)}</div>`:''}</div>
    <div id="list">${listHtml()}</div>
    <div class="foot">Цены в сомах.${m.st?' «В наличии» — 5 шт и более, при меньшем остатке указано точное количество.':''} Заказ из корзины приходит нам сразу, мы свяжемся для подтверждения.</div></main>
   <button class="btn acc fab" id="fab" data-cart="1" hidden>Корзина · <span data-cartsum></span></button>`;
  updCart();lazy();
  $('#q').addEventListener('input',e=>{S.q=e.target.value;relist()});
  $('#g').addEventListener('change',e=>{S.g=e.target.value;relist();window.scrollTo({top:0})});
  $('#srt').addEventListener('change',e=>{S.sort=e.target.value;relist()});
  $('#only')?.addEventListener('change',e=>{S.only=e.target.checked;relist()})}
function relist(){$('#list').innerHTML=listHtml();lazy()}
function fmtDt(iso){if(!iso)return '—';const d=new Date(iso);return d.toLocaleDateString('ru-RU',{day:'2-digit',month:'2-digit'})+' '+d.toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'})}
let io=null;function lazy(){if(!('IntersectionObserver' in window)){document.querySelectorAll('img[data-th]').forEach(loadTh);return}
  io?.disconnect();io=new IntersectionObserver(es=>{for(const e of es)if(e.isIntersecting){io.unobserve(e.target);loadTh(e.target)}},{rootMargin:'300px'});document.querySelectorAll('img[data-th]:not([src])').forEach(i=>io.observe(i))}
async function loadTh(img){const id=img.dataset.th;if(S.th[id]){img.src=S.th[id];return}try{const d=await db.doc('optthumb/'+id).get();if(d.exists&&d.data().t){S.th[id]=d.data().t;document.querySelectorAll(`img[data-th="${CSS.escape(id)}"]`).forEach(x=>x.src=S.th[id])}}catch(e){}}

/* ---------- карточка товара ---------- */
async function openItem(pid){const r=S.rows.find(x=>String(x.i)===String(pid));if(!r)return;S.open={r,imgs:[],desc:'',k:0,loading:true};modal();
  try{const d=await db.doc('optinfo/'+pid).get();if(d.exists){const x=d.data();S.open.imgs=x.imgs||[];S.open.desc=x.desc||''}}catch(e){}if(S.open&&S.open.r===r){S.open.loading=false;modal()}}
function modal(){let el=$('#md');const o=S.open;if(!o){el?.remove();document.body.style.overflow='';return}
  if(!el){el=document.createElement('div');el.id='md';el.className='md';document.body.appendChild(el);document.body.style.overflow='hidden'}const r=o.r;const id='i'+r.i;
  el.innerHTML=`<div class="mdc" role="dialog" aria-modal="true" aria-label="${esc(r.n)}"><div class="gal">${o.loading?'<div class="big">Загрузка…</div>':o.imgs.length?`<div class="big"><img src="${o.imgs[o.k]}" alt="${esc(r.n)}"></div>${o.imgs.length>1?`<div class="sm">${o.imgs.map((s,i)=>`<button data-k="${i}" aria-current="${i===o.k}"><img src="${s}" alt="Фото ${i+1}"></button>`).join('')}</div>`:''}`:`<div class="big" style="color:#B9B6AE">${ICO_BOX}</div>`}</div>
   <div class="inf"><button class="x" data-close="1" aria-label="Закрыть">×</button><h3>${esc(r.n)}</h3><div class="nm"><div class="m">${r.nw?'<span class="pill new">★ новинка</span>':''}${stPill(r)}${r.w?`<span>гарантия ${esc(r.w)}</span>`:''}<span>${esc(r.g)}</span></div>${r.nt?`<div class="m"><span class="nt">${esc(r.nt)}</span></div>`:''}</div>
    ${o.desc?`<div class="desc">${esc(o.desc)}</div>`:o.loading?'':'<div class="desc" style="color:var(--muted)">Описания пока нет — спросите у нас.</div>'}
    <div style="display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:auto;padding-top:8px"><div class="pr">${NF.format(r.p)} <small>сом</small></div><div data-ctl="${esc(id)}">${ctlHtml(id)}</div></div></div></div>`}

/* ---------- корзина и заказ ---------- */
function drawer(){let el=$('#dr');if(!S.cartOpen){el?.remove();document.body.style.overflow='';return}
  if(!el){el=document.createElement('div');el.id='dr';el.className='ov';document.body.appendChild(el);document.body.style.overflow='hidden'}
  const sent=S.sent;const m=S.meta;const keep={n:$('#on')?.value,p:$('#op')?.value,a:$('#oa')?.value,r:$('#or')?.value,c:$('#oc')?.value};
  el.innerHTML=`<div class="drawer" role="dialog" aria-modal="true" aria-label="Корзина"><div class="dh"><h2>Корзина</h2><button class="x" data-close="1" aria-label="Закрыть">×</button></div>
   <div class="db">${sent?`<div class="ok">Заказ <b>${esc(sent.no)}</b> на ${money(sent.total)} отправлен.<br>В ближайшее время с вами свяжется менеджер по продажам в WhatsApp, чтобы подтвердить заказ.</div>${m.wa?`<a class="btn wa" href="https://wa.me/${esc(m.wa)}?text=${encodeURIComponent(sent.text)}" target="_blank" rel="noopener">Продублировать в WhatsApp</a>`:''}<button class="btn line" data-close="1">Вернуться в каталог</button>`
    :S.cart.length?S.cart.map(x=>`<div class="cl"><div><div class="t">${esc(x.n)}</div><div class="u">${NF.format(x.p)} сом × ${x.q}</div></div><div class="s">${money(x.p*x.q)}</div><div data-ctl="${esc(x.id)}">${ctlHtml(x.id)}</div><button class="rm" data-rm="${esc(x.id)}">Убрать</button></div>`).join('')
    :'<div class="empty">Корзина пуста. Нажмите «В корзину» у нужных товаров.</div>'}
   ${!sent&&S.cart.length?`<form class="of" id="of" novalidate><h3>Оформление заказа</h3>
    <label class="f">Имя или компания *<input id="on" value="${esc(S.me.name)}" autocomplete="organization" placeholder="Например: Азамат, «Комп Сервис»"><span class="fe" id="on-e"></span></label>
    <label class="f">WhatsApp *<input id="op" inputmode="tel" value="${esc(S.me.phone)}" autocomplete="tel" placeholder="+996 555 123 456"><span class="fe" id="op-e"></span></label>
    <label class="f">Адрес доставки<input id="oa" value="${esc(S.me.addr||'')}" autocomplete="street-address" placeholder="Город, улица, дом — или «самовывоз»"></label>
    <label class="f">Телефон того, кто примет доставку<input id="or" inputmode="tel" value="${esc(S.me.rcv||'')}" autocomplete="off" placeholder="+996 …"><span class="fe" id="or-e"></span></label>
    <label class="f">Комментарий<textarea id="oc" placeholder="Оплата, удобное время доставки"></textarea></label>
    <p class="hint">После отправки в ближайшее время с вами свяжется менеджер по продажам в WhatsApp, чтобы подтвердить заказ, наличие и доставку.</p></form>`:''}</div>
   ${!sent&&S.cart.length?`<div class="df"><div class="tot"><span>Итого</span><span data-cartsum>${money(cartTot())}</span></div><p class="err" id="oe"></p><button class="btn acc" id="ob" type="submit" form="of">Отправить заказ</button></div>`:''}</div>`;
  if(keep.n!=null&&$('#on')){$('#on').value=keep.n;$('#op').value=keep.p;$('#oa').value=keep.a;$('#or').value=keep.r;$('#oc').value=keep.c}
  $('#of')?.addEventListener('submit',sendOrder)}
async function sendOrder(e){e.preventDefault();const name=$('#on').value.trim(),phone=$('#op').value.trim(),addr=$('#oa').value.trim(),rcv=$('#or').value.trim(),comment=$('#oc').value.trim();const err=$('#oe');err.textContent='';
  const bad=[];const fe=(id,msg)=>{const x=$('#'+id+'-e');if(x)x.textContent=msg||'';$('#'+id)?.classList.toggle('inv',!!msg);if(msg)bad.push(id)};
  fe('on',name?'':'Укажите имя или название компании');fe('op',phone.replace(/\D/g,'').length>=9?'':'Укажите номер WhatsApp полностью, например +996 555 123 456');
  fe('or',rcv&&rcv.replace(/\D/g,'').length<9?'Номер указан не полностью':addr&&!/самовывоз/i.test(addr)&&!rcv?'Укажите, кто примет доставку':'');
  if(bad.length){err.textContent='Заполните отмеченные поля';$('#'+bad[0])?.focus();return}
  const items=S.cart.map(x=>x.id[0]==='k'?{k:x.id.slice(1),n:x.n,q:x.q,p:x.p}:{i:x.id.slice(1),n:x.n,q:x.q,p:x.p});const total=Math.round(cartTot()*100)/100;
  const b=$('#ob');b.disabled=true;b.textContent='Отправляю…';S.me={name,phone,addr,rcv};LS.set('opt_me',S.me);
  try{const ref=db.collection('optorders').doc();await ref.set({at:new Date().toISOString(),key:S.key,name:name.slice(0,120),phone:phone.slice(0,40),addr:addr.slice(0,300),rcv:rcv.slice(0,40),comment:comment.slice(0,1000),items,total,st:'new'});
    const no='З-'+ref.id.slice(-5).toUpperCase();const text=`Заказ ${no} из оптового каталога\n${name}, WhatsApp ${phone}\n${addr?'Доставка: '+addr+(rcv?', принимает: '+rcv:'')+'\n':''}`+S.cart.map(x=>`• ${x.n} × ${x.q} = ${NF.format(x.p*x.q)} сом`).join('\n')+`\nИтого: ${money(total)}${comment?'\n'+comment:''}`;
    S.sent={no,total,text};S.cart=[];cartSave();updCart();drawer()}
  catch(ex){b.disabled=false;b.textContent='Отправить заказ';err.textContent='Не удалось отправить. Проверьте интернет и попробуйте ещё раз'}}

/* ---------- события ---------- */
document.addEventListener('click',e=>{const t=e.target.closest('[data-add],[data-q],[data-open],[data-cart],[data-close],[data-rm],[data-k],[data-out]');if(!t)return;
  if(t.dataset.add){const id=t.dataset.add;const r=id[0]==='k'?(S.meta.kits||[]).find(k=>'k'+k.k===id):S.rows.find(x=>'i'+x.i===id);if(r){setQty(id,1,r);toast('Добавлено в корзину')}return}
  if(t.dataset.q){const id=t.dataset.id;const c=inCart(id);if(c)setQty(id,c.q+Number(t.dataset.q),c);return}
  if(t.dataset.open){openItem(t.dataset.open);return}
  if(t.dataset.cart){S.sent=null;S.cartOpen=true;drawer();return}
  if(t.dataset.rm){setQty(t.dataset.rm,0);return}
  if(t.dataset.k!=null&&S.open){S.open.k=Number(t.dataset.k);modal();return}
  if(t.dataset.out){LS.del('opt_key');S.key=null;S.cart=[];loginView();return}
  if(t.dataset.close){if(S.open){S.open=null;modal()}else{S.cartOpen=false;S.sent=null;drawer()}}});
document.addEventListener('click',e=>{if(e.target.id==='md'){S.open=null;modal()}if(e.target.id==='dr'){S.cartOpen=false;S.sent=null;drawer()}});
document.addEventListener('change',e=>{const id=e.target.dataset?.qi;if(id){const c=inCart(id);if(c)setQty(id,e.target.value,c)}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(S.open){S.open=null;modal()}else if(S.cartOpen){S.cartOpen=false;S.sent=null;drawer()}}});

(async()=>{if(!db){loginView('Не удалось подключиться. Обновите страницу');return}
  if(S.key){try{if(await load(S.key)){main();return}LS.del('opt_key');S.key=null;loginView('Пароль изменился — войдите заново');return}catch(e){loginView('Нет связи. Проверьте интернет');return}}loginView()})();
})();
</script>
</body>
</html>
