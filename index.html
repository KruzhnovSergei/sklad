<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="icon" href="favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#1D6A4F">
<title>Склад и касса</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&family=Unbounded:wght@500;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: рабочий стол кладовщика — шапка со складом и ролью, вкладки-разделы, плотные таблицы; касса в две колонки (витрина | чек) */
:root{
  --bg:#ECF0EE; --surface:#FFFFFF; --sunk:#F5F7F6; --ink:#15201C; --muted:#5B6964; --line:#D3DBD7;
  --accent:#1D6A4F; --accent-ink:#FFFFFF; --accent-soft:#B9DCCB;
  --good:#2C7A4B; --warn:#A8620B; --bad:#B0281F; --warn-bg:#FBEBD3; --bad-bg:#F8DEDA; --good-bg:#DCEFE3;
  --f-display:"Unbounded","Golos Text",system-ui,sans-serif;
  --f-body:"Golos Text",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
  --r:8px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F1513; --surface:#17201C; --sunk:#121a17; --ink:#E3ECE7; --muted:#93A29C; --line:#2A3631;
  --accent:#54C195; --accent-ink:#08130F; --accent-soft:#25523F;
  --good:#6FCF97; --warn:#E6A650; --bad:#F2877E; --warn-bg:#3A2C15; --bad-bg:#3D1F1C; --good-bg:#183324;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1513; --surface:#17201C; --sunk:#121a17; --ink:#E3ECE7; --muted:#93A29C; --line:#2A3631;
  --accent:#54C195; --accent-ink:#08130F; --accent-soft:#25523F;
  --good:#6FCF97; --warn:#E6A650; --bad:#F2877E; --warn-bg:#3A2C15; --bad-bg:#3D1F1C; --good-bg:#183324;
  color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45}
.shell{display:grid;grid-template-columns:236px minmax(0,1fr);min-height:100vh}
.side{position:sticky;top:0;height:100vh;overflow-y:auto;background:var(--surface);border-right:1px solid var(--line);padding:18px 12px 16px;display:flex;flex-direction:column;gap:6px}
.side .brand{padding:0 8px 10px;font-size:17px}
.main{min-width:0;width:100%;max-width:1360px;padding-inline:24px;padding-block:20px 56px}
#tabs{display:flex;flex-direction:column;gap:1px}
.nav-g{font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);padding:12px 10px 4px;font-weight:600}
#tabs button{all:unset;box-sizing:border-box;display:flex;align-items:center;gap:10px;width:100%;padding:8px 10px;border-radius:8px;color:var(--ink);font-size:14px;cursor:pointer;line-height:1.25}
#tabs button:hover{background:var(--sunk)}
#tabs button[aria-current="page"]{background:var(--accent-soft);font-weight:600}
#tabs button[aria-current="page"] svg{color:var(--accent);opacity:1}
#tabs button:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
#tabs svg,.menu-btn svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none;opacity:.75}
.side-foot{margin-top:auto;padding:14px 6px 0;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:10px}
.side-foot .who{flex-wrap:wrap}
.mtop{display:none}
.menu-btn{all:unset;cursor:pointer;width:40px;height:40px;display:grid;place-items:center;border-radius:8px;border:1px solid var(--line);background:var(--surface)}
.menu-btn svg{opacity:1;width:20px;height:20px}
#secTitle{font-family:var(--f-display);font-weight:600;font-size:16px}
#scrim{display:none}
#cartFab{display:none}
@media (max-width:980px){
  .shell{display:block}
  .side{position:fixed;inset:0 auto 0 0;width:min(290px,86vw);height:100%;z-index:45;transform:translateX(-105%);box-shadow:0 0 40px rgb(0 0 0 / .25);padding-top:calc(18px + env(safe-area-inset-top,0px))}
  body.nav-open .side{transform:none}
  body.nav-open #scrim{display:block;position:fixed;inset:0;background:rgb(10 16 14 / .4);z-index:44}
  .mtop{display:flex;align-items:center;gap:12px;position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);padding-block:10px;margin-bottom:4px}
  .main{padding-inline:16px;padding-block:6px 88px}
  #cartFab:not([hidden]){display:flex;position:fixed;left:16px;right:16px;bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:30;justify-content:space-between;align-items:center;gap:10px;border:0;border-radius:12px;padding:14px 18px;background:var(--accent);color:var(--accent-ink);font:600 15px var(--f-body);box-shadow:0 8px 24px rgb(0 0 0 / .2);cursor:pointer}
}
@media (prefers-reduced-motion:no-preference){.side{transition:transform .2s ease}}
h1,h2,h3{margin:0;text-wrap:balance}
h2{font-size:17px;font-weight:600}
p{margin:0}
.muted{color:var(--muted)}
.small{font-size:13px}
.mono{font-family:var(--f-mono);font-size:.86em;letter-spacing:.02em}
.num{font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.top{display:flex;flex-wrap:wrap;align-items:center;gap:12px 20px;padding-block:6px 14px}
.brand{font-family:var(--f-display);font-weight:700;font-size:19px;letter-spacing:.01em;display:flex;align-items:center;gap:8px}
.brand i{display:inline-block;width:22px;height:22px;border-radius:4px;background:var(--accent);position:relative}
.brand i::after{content:"";position:absolute;left:5px;right:5px;top:10px;height:2px;background:var(--accent-ink);box-shadow:0 -5px 0 var(--accent-ink),0 5px 0 var(--accent-ink)}
.whsel{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);margin-left:auto}
.whsel select{min-width:170px}
.who{font-size:13px;color:var(--muted);display:flex;gap:8px;align-items:center}
.tabs{display:flex;gap:2px;overflow-x:auto;border-bottom:1px solid var(--line);margin-bottom:16px;scrollbar-width:none}
.tabs button{all:unset;cursor:pointer;padding:10px 14px;font-weight:500;color:var(--muted);border-bottom:2px solid transparent;white-space:nowrap;font-size:14px}
.tabs button:hover{color:var(--ink)}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.tabs button:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.grp td{background:var(--sunk);font-weight:700;cursor:pointer;padding-top:9px;padding-bottom:9px}.grp:hover td{background:var(--accent-soft)}.grp .caret{display:inline-block;width:14px;color:var(--accent)}.grp .gmeta{font-weight:400;color:var(--muted);font-size:12.5px}
.plg td{background:#1E3A5F!important;color:#fff;text-transform:uppercase;letter-spacing:.04em;font-size:13px;cursor:default}.plg .gmeta{color:#CFE0F2;text-transform:none;letter-spacing:0}
.banner{padding:10px 14px;border-radius:var(--r);background:var(--warn-bg);color:var(--ink);margin-bottom:14px;font-size:14px}
.pane{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:18px;min-width:0;box-shadow:0 1px 2px rgb(16 32 26 / .04)}
.pane-h{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:6px 12px;margin-bottom:12px}
.stack{display:flex;flex-direction:column;gap:16px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.between{justify-content:space-between}
.end{justify-content:flex-end}
.field{display:flex;flex-direction:column;gap:4px;min-width:0;flex:1 1 180px}
.field>span{font-size:12px;color:var(--muted);letter-spacing:.03em}
.check{display:inline-flex;gap:8px;align-items:center;font-size:14px;cursor:pointer}
.check input{width:auto}
input,select,textarea{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:8px 10px;min-width:0;width:100%}
textarea{font-family:var(--f-mono);font-size:13px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:-1px;border-color:transparent}
input.sm{padding:6px 8px;width:86px;text-align:right;font-variant-numeric:tabular-nums}
input.xs{padding:5px 6px;width:56px;text-align:right;font-variant-numeric:tabular-nums}
.search{margin-bottom:12px}
.btn{all:unset;box-sizing:border-box;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:9px 14px;border-radius:6px;font-weight:600;font-size:14px;background:var(--accent);color:var(--accent-ink);white-space:nowrap}
.btn:hover{filter:brightness(1.08)}
.btn:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.ghost:hover{background:var(--sunk);filter:none}
.btn.danger{background:var(--bad);color:var(--surface)}
.btn.big{padding:13px 18px;font-size:16px;width:100%}
.btn.link{background:none;color:var(--accent);padding:4px 6px;font-weight:500}
.btn.link.bad{color:var(--bad)}
.btn[disabled]{opacity:.45;pointer-events:none}
.x{all:unset;cursor:pointer;width:28px;height:28px;display:inline-grid;place-items:center;border-radius:6px;color:var(--muted);font-size:18px}
.x:hover{background:var(--sunk);color:var(--bad)}
.x:focus-visible{outline:2px solid var(--accent)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:7px;padding:2px;gap:2px;background:var(--sunk);flex-wrap:wrap}
.seg button{all:unset;cursor:pointer;padding:6px 12px;border-radius:5px;font-size:13px;font-weight:500;color:var(--muted)}
.seg.mini button{padding:3px 8px;font-size:12px}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 0 0 1px var(--line)}
.seg button:focus-visible{outline:2px solid var(--accent)}
.chip{display:inline-block;padding:2px 8px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap}
.chip.ok,.chip.t-in{background:var(--good-bg);color:var(--good)}
.chip.low{background:var(--warn-bg);color:var(--warn)}
.chip.out,.chip.t-off{background:var(--bad-bg);color:var(--bad)}
.chip.t-sale{background:var(--accent-soft);color:var(--ink)}
.chip.t-pay{background:var(--warn-bg);color:var(--warn)}
.chip.t-move,.chip.role{background:var(--sunk);color:var(--muted);box-shadow:inset 0 0 0 1px var(--line)}
.sns{display:flex;flex-wrap:wrap;gap:4px;align-items:center;margin-block:4px}
.sn{font-family:var(--f-mono);font-size:11.5px;padding:1px 6px;border-radius:4px;background:var(--sunk);border:1px solid var(--line);white-space:nowrap}
.tbl{overflow-x:auto;margin-inline:-4px}
table{border-collapse:collapse;width:100%;font-size:14px}
th{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600;text-align:left;padding:8px;border-bottom:1px solid var(--line);white-space:nowrap}
th.num{text-align:right}
td{padding:8px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
tbody tr:hover td{background:var(--sunk)}
@media (max-width:640px){.hm{display:none}}
.mo{display:none}@media (max-width:640px){.mo{display:inline}}
@media (max-width:1250px){.hg{display:none}}
.plist td{padding-inline:6px}
.pname{font-weight:500}
.psku{display:block;font-family:var(--f-mono);font-size:11.5px;color:var(--muted)}
.debt{color:var(--bad);font-weight:600}
.sale{display:grid;grid-template-columns:minmax(0,1fr) minmax(320px,380px);gap:16px;align-items:start}
@media (max-width:880px){.sale{grid-template-columns:1fr}}
.cart{position:sticky;top:calc(env(safe-area-inset-top,0px) + 8px)}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.tile{all:unset;box-sizing:border-box;cursor:pointer;display:flex;flex-direction:column;gap:6px;padding:12px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);min-height:104px}
.tile:hover{border-color:var(--accent)}
.tile:focus-visible{outline:2px solid var(--accent)}
.tile .tn{font-weight:500;line-height:1.3;flex:1}
.tile .tp{font-weight:700;font-variant-numeric:tabular-nums}
.tile .ta{font-size:12px;color:var(--muted);display:flex;justify-content:space-between;gap:6px}
.tile.zero{opacity:.55}
.line{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 10px;padding:10px 0;border-bottom:1px dashed var(--line)}
.line .ctl{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted);flex-wrap:wrap}
.line .lt{font-weight:600;font-variant-numeric:tabular-nums;text-align:right;align-self:center}
.line .warn{grid-column:1/-1;font-size:12px;color:var(--bad)}
.line .warn:empty{display:none}
.sumrows{display:flex;flex-direction:column;gap:6px;padding-top:10px;font-size:14px}
.total{display:flex;justify-content:space-between;align-items:baseline;padding-block:12px;font-size:15px;gap:10px}
.total b{font-family:var(--f-display);font-size:26px;font-weight:700;font-variant-numeric:tabular-nums}
.total small{display:block;font-size:12px}
.err{color:var(--bad);font-size:13px}
.err:empty{display:none}
.empty{padding:28px 12px;text-align:center;color:var(--muted)}
.infobox{padding:8px 10px;border-radius:6px;background:var(--sunk);font-size:13px}
.infobox:empty{display:none}
.picker{position:relative}
.results{position:absolute;left:0;right:0;top:calc(100% + 4px);z-index:5;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:0 10px 30px rgb(0 0 0 / .12);max-height:300px;overflow:auto}
.results button{all:unset;box-sizing:border-box;cursor:pointer;display:flex;justify-content:space-between;gap:10px;width:100%;padding:9px 12px;border-bottom:1px solid var(--line)}
.results button:hover,.results button:focus-visible{background:var(--sunk)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px;display:flex;flex-direction:column;gap:4px;min-width:0;box-shadow:0 1px 2px rgb(16 32 26 / .04)}
.kpi small{font-size:12px;color:var(--muted);font-weight:400}
.kpi span{font-size:12px;color:var(--muted);letter-spacing:.03em}
.kpi b{font-size:20px;line-height:1.25;font-weight:700;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.kpi.main b{font-family:var(--f-display);color:var(--accent)}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px}
@media (max-width:880px){.two{grid-template-columns:1fr}}
.chart{width:100%;height:auto;display:block}
.chart text{fill:var(--muted);font-size:11px;font-family:var(--f-body)}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.barcell{position:relative}
.barcell::before{content:"";position:absolute;inset:6px auto 6px 0;width:var(--w,0%);background:var(--accent-soft);border-radius:3px;opacity:.6}
.barcell span{position:relative}
.jrow{cursor:pointer}
.jrow:focus-visible td{outline:2px solid var(--accent);outline-offset:-2px}
.jdet>td{background:var(--sunk)}
.jdet table{font-size:13px}
.confirm{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:10px 12px;background:var(--bad-bg);border-radius:6px}
.snres{padding:12px 14px;border-radius:var(--r);border:1px solid var(--line);background:var(--sunk);margin-bottom:12px;display:flex;flex-direction:column;gap:4px}
.onb{max-width:640px;margin:24px auto}
.onb ol{padding-left:20px;display:flex;flex-direction:column;gap:6px;margin:0}
#modal{position:fixed;inset:0;background:rgb(10 16 14 / .45);display:grid;place-items:center;z-index:50;padding:16px}
.mcard{background:var(--surface);border:1px solid var(--line);border-radius:10px;width:100%;max-width:540px;max-height:calc(100% - 32px);overflow:auto;padding:20px;display:flex;flex-direction:column;gap:14px}
.receipt{font-family:var(--f-mono);font-size:13px;background:var(--sunk);border:1px dashed var(--line);border-radius:6px;padding:14px;white-space:pre-wrap;margin:0;overflow-x:auto}
.snlist{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:6px;max-height:300px;overflow:auto;padding:2px}
.snlist label{display:flex;gap:8px;align-items:center;padding:6px 8px;border:1px solid var(--line);border-radius:6px;font-family:var(--f-mono);font-size:12.5px;cursor:pointer}
.snlist input{width:auto}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;font-size:14px;z-index:60;max-width:calc(100% - 32px)}
@media (prefers-reduced-motion:no-preference){.tile,.btn{transition:border-color .12s,filter .12s}}
@media (max-width:520px){.whsel{margin-left:0;width:100%}.whsel select{flex:1}input.sm{width:72px}}
.chip.t-ret{background:var(--bad-bg);color:var(--bad)}
.chip.t-wx{background:var(--warn-bg);color:var(--warn)}
.wcard{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:8px 16px;font-size:14px}
.wcard>div>span:first-child{display:block;font-size:12px;color:var(--muted)}
.hist{display:flex;flex-direction:column;gap:4px;font-size:13px;margin:8px 0;padding-left:12px;border-left:2px solid var(--line)}
textarea.plain{font-family:var(--f-body);font-size:14px}
label.sn{display:inline-flex;gap:6px;align-items:center;cursor:pointer}
label.sn input{width:auto}
.gchips{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;margin-bottom:8px;scrollbar-width:thin}
.gchip{all:unset;cursor:pointer;padding:5px 12px;border-radius:999px;border:1px solid var(--line);font-size:13px;white-space:nowrap;color:var(--muted)}
.gchip b{font-weight:600;margin-left:6px;opacity:.7}
.gchip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.gchip:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.plist td{padding:7px 8px}
.plist tr{cursor:pointer}
.plist tr.zero td{opacity:.55}
.plist .add{all:unset;cursor:pointer;width:30px;height:30px;display:inline-grid;place-items:center;border-radius:6px;background:var(--accent);color:var(--accent-ink);font-size:18px;font-weight:600}
.plist tr:hover .add{filter:brightness(1.1)}
.perm{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:6px 14px}

.steps{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:4px;font-size:14px}
.hits{display:flex;flex-direction:column;max-height:200px;overflow:auto;border:1px solid var(--line);border-radius:6px}

.hits button[aria-pressed="true"]{font-weight:600}

.mcard.wide{max-width:880px}
.talon h1{font-size:17px;text-align:center;margin:10px 0 2px}.talon .sub{text-align:center;color:var(--muted);margin-bottom:10px;font-size:13px}.talon .shop{font-size:13px}

.talon tr.pc td{background:var(--sunk)}.talon tr.nw td{color:var(--warn)}.talon .terms{font-size:12px;color:var(--muted);margin-top:10px}.talon .sign,.talon .mp,.talon style{display:none}

<body>
<div class="shell">
  <aside class="side" id="side" aria-label="Разделы">
    <div class="brand"><i aria-hidden="true"></i>Склад и касса</div>

async function guard(fn,okMsg,need='sell'){
  if(S.prev){toast('Режим проверки: изменения не сохраняются');return false}
  if(!S.db){toast('Хранилище недоступно в этом просмотре');return false}
  if(need==='owner'?!S.isOwner:!can(need)){toast('Нет прав на это действие. Обратитесь к владельцу.');return false}
  if(S.busy)return false;S.busy=true;
  try{await fn();if(okMsg)toast(okMsg);return true}
  catch(e){const c=e?.code;
    if(c==='invalid_argument'||c==='permission-denied')toast('Недостаточно прав для этого действия');
    else if(c==='quota_exceeded'||c==='resource-exhausted')toast('Хранилище заполнено: удалите старые документы в журнале');
    else if(c==='revoked')toast('Доступ к данным закрыт');
    else toast('Не удалось сохранить. Проверьте связь и повторите');
    return false}
  finally{S.busy=false}
}

/* ---------- серийные номера ---------- */
const snWh=c=>c.t==='inv'?S.inv.wh:c.t==='cart'?S.curWh:c.t==='asm'?S.asm.wh:S.op.wh;
function snLine(){const c=S.snCtx;return c.t==='inv'?S.inv.items[c.i]:c.t==='cart'?S.cart[c.i]:c.t==='asm'?S.asm.items[c.i]:S.op.items[c.i]}
function snOpen(t,i,isNew){
  S.snCtx={t,i,isNew};const l=snLine();const p=S.P[l.p];
  if(t==='op'&&S.opMode==='in'){
    openModal(`<h2>Серийные номера: ${esc(p.name)}</h2><p class="muted">Введите или отсканируйте номера поступившего товара, каждый с новой строки. Количество посчитается само.</p>
    <textarea id="snTxt" rows="8" aria-label="Серийные номера">${esc((l.sn||[]).join('\n'))}</textarea><div class="err" id="snErr"></div>
    <div class="row end"><span class="muted small" id="snCnt" style="margin-right:auto"></span><button class="btn ghost" data-act="modal-close">Отмена</button><button class="btn" data-act="sn-ok">Готово</button></div>`,snCancel);
    setTimeout(()=>{const e=$('#snTxt');e?.focus();snCount()},30);return}
  const wh=snWh(S.snCtx);S.snSel=new Set(l.sn||[]);S.snF='';
  const busy=snBusy();const avail=snAvailCtx(wh,l.p).filter(x=>!busy.includes(x));
  openModal(`<h2>Серийные номера: ${esc(p.name)}</h2><p class="muted">Склад «${esc(wname(wh))}», в наличии ${avail.length} шт. Отметьте номера, которые уходят.</p>
   ${avail.length>8?`<input id="snF" data-in="snf" placeholder="Поиск номера" autocomplete="off">`:''}
   <div class="snlist" id="snList">${snListHtml(wh,l.p)}</div><div class="err" id="snErr"></div>
   <div class="row end"><span class="muted small" id="snCnt" style="margin-right:auto">Выбрано: ${S.snSel.size}</span><button class="btn ghost" data-act="modal-close">Отмена</button><button class="btn" data-act="sn-ok">Готово</button></div>`,snCancel)}
const snBusy=()=>{const c=S.snCtx;return c&&c.t==='cart'?S.cart.filter((_,j)=>j!==c.i).flatMap(x=>x.sn||[]):c&&c.t==='inv'?S.inv.items.filter((_,j)=>j!==c.i).flatMap(x=>x.sn||[]):[]};
const snAvailCtx=(wh,p)=>S.snCtx?.t==='inv'?invSnAvail(p):snAt(wh,p);
function snListHtml(wh,p){const f=S.snF.trim().toLowerCase();const busy=snBusy();const a=snAvailCtx(wh,p).filter(s=>!busy.includes(s)&&(!f||s.toLowerCase().includes(f)));
  return a.length?a.map(s=>`<label><input type="checkbox" data-ch="snchk" value="${esc(s)}"${S.snSel.has(s)?' checked':''}>${esc(s)}</label>`).join(''):'<div class="muted">Номеров нет</div>'}
function snCount(){const e=$('#snCnt'),t=$('#snTxt');if(e&&t)e.textContent='Номеров: '+snParse(t.value).length}
const snParse=v=>v.split(/[\n,;\t]+/).map(s=>s.trim()).filter(Boolean);
function snCancel(){const c=S.snCtx;if(!c)return;const l=snLine();if(c.isNew&&l&&!(l.sn||[]).length){(c.t==='inv'?S.inv.items:c.t==='cart'?S.cart:c.t==='asm'?S.asm.items:S.op.items).splice(c.i,1)}S.snCtx=null;render()}
function snOk(){
  const c=S.snCtx,l=snLine(),err=$('#snErr');
  if(c.t==='op'&&S.opMode==='in'){const a=snParse($('#snTxt').value);
    const seen=new Set();for(const s of a){if(seen.has(s)){err.textContent=`Номер ${s} введён дважды`;return}seen.add(s);
      if(S.snLoc[s]){err.textContent=`Номер ${s} уже числится на складе «${wname(S.snLoc[s].wh)}»`;return}
      if(S.op.items.some((x,j)=>j!==c.i&&(x.sn||[]).includes(s))){err.textContent=`Номер ${s} уже есть в другой строке`;return}}
    if(!a.length){err.textContent='Введите хотя бы один номер';return}
    l.sn=a;l.q=a.length}
  else{if(!S.snSel.size){err.textContent='Отметьте хотя бы один номер';return}l.sn=[...S.snSel].sort();l.q=l.sn.length;
    if(c.t==='cart'&&l.sn.some(x=>S.pca[x])){S.cart.splice(c.i,1,...l.sn.map(x=>({p:l.p,q:1,price:S.pca[x]?pcPrice(x):num(S.P[l.p]?.sellPrice),disc:l.disc||'',sn:[x]})))}
    if(c.t==='inv'&&l.sn.length>1&&l.sn.some(x=>S.pca[x])){S.inv.items.splice(c.i,1,...l.sn.map(x=>({p:l.p,q:'1',price:String(S.pca[x]?pcPrice(x):num(l.price)),disc:l.disc||'',sn:[x]})))}
    else if(c.t==='inv'&&l.sn.length===1&&S.pca[l.sn[0]]&&!l.orig)l.price=String(pcPrice(l.sn[0]))}
  S.snCtx=null;closeModal(true);render()}

/* ---------- остатки ---------- */
function vStock(){
  const TR={},TRW={};for(const po of S.posL){if(!isOpenPO(po))continue;for(const l of poRemain(po))if(l.rem>0){TR[l.p]=(TR[l.p]||0)+l.rem;TRW[l.p+':'+po.wh]=(TRW[l.p+':'+po.wh]||0)+l.rem}}
  if(!S.wh.length)return emptyWh();
  const VW=viewWh();const lim=VW.length<S.wh.length;if(!VW.length)return '<div class="pane empty">Вам не открыт ни один склад. Обратитесь к владельцу.</div>';
  if(S.stockWh!=='all'&&!VW.some(w=>w.id===S.stockWh))S.stockWh=VW.length>1?'all':VW[0].id;if(S.stockWh==='all'&&VW.length===1)S.stockWh=VW[0].id;
  if(lim){for(const k in TR)delete TR[k];for(const po of S.posL){if(!isOpenPO(po)||!VW.some(w=>w.id===po.wh))continue;for(const l of poRemain(po))if(l.rem>0)TR[l.p]=(TR[l.p]||0)+l.rem}}
  const all=S.stockWh==='all';const whs=all?VW:[S.W[S.stockWh]].filter(Boolean);const cols=all&&VW.length<=5;const sc=can('cost');
  const allRows=S.prod.filter(p=>!p.archived).map(p=>{const q=all?qtyIn(VW,p.id):qty(S.stockWh,p.id);return{p,q,st:status(q,num(p.minStock))}});
  const f=S.stockQ.trim().toLowerCase();
  const rows=allRows.filter(r=>(!f||(r.p.name||'').toLowerCase().includes(f)||(r.p.sku||'').toLowerCase().includes(f)||(r.p.cat||'').toLowerCase().includes(f))&&(!S.stockLow||r.st[0]!=='ok')&&(S.stockZero||S.stockLow||f||r.q!==0)&&inGroup(r.p,S.stockG));
  const vc=allRows.reduce((s,r)=>s+Math.max(0,r.q)*cost(r.p.id),0), vr=allRows.reduce((s,r)=>s+Math.max(0,r.q)*num(r.p.sellPrice),0);
  const nLow=allRows.filter(r=>r.st[0]==='low').length,nOut=allRows.filter(r=>r.st[0]==='out').length;
  return `<div class="stack">
  <div class="kpis"><div class="kpi"><span>Позиций в наличии</span><b>${allRows.filter(r=>r.q>0).length}</b></div>${sc?`<div class="kpi"><span>Сумма по себестоимости</span><b>${money(vc)}</b></div>`:''}<div class="kpi"><span>Сумма в ценах продажи</span><b>${money(vr)}</b></div><div class="kpi"><span>Заканчиваются / нет</span><b><span style="color:var(--warn)">${nLow}</span> / <span style="color:var(--bad)">${nOut}</span></b></div></div>
  <section class="pane"><div class="pane-h"><h2>Остатки</h2><div class="row" style="gap:8px">${S.stockG?'':`<button class="btn link" data-act="st-collapse">${(S.stockCol?.size||0)?'Развернуть все группы':'Свернуть все группы'}</button>`}<button class="btn ghost" data-act="exp-stock">Скачать CSV</button></div></div>
  <div class="row" style="margin-bottom:12px">
   <select id="stWh" data-ch="stwh" style="flex:0 1 220px" aria-label="Склад">${VW.length>1?`<option value="all">${lim?'Все мои склады':'Все склады'}</option>`:''}${VW.map(w=>`<option value="${esc(w.id)}"${w.id===S.stockWh?' selected':''}>${esc(w.name)}</option>`).join('')}</select>
   <select id="stG" data-ch="stg" style="flex:0 1 200px" aria-label="Группа">${groupOpts(S.stockG)}</select>
   <input id="stQ" data-in="stq" placeholder="Поиск товара" value="${esc(S.stockQ)}" style="flex:1 1 200px">
   <label class="check"><input type="checkbox" id="stLow" data-ch="stlow"${S.stockLow?' checked':''}> Только заканчивающиеся</label><label class="check"><input type="checkbox" data-ch="stzero"${S.stockZero?' checked':''}> Показывать товары с нулевым остатком</label></div>
  <div class="tbl">${rows.length?`<table><thead><tr><th>Товар</th>${S.stockG?'<th>Группа</th>':''}<th>Ед.</th>${cols?whs.map(w=>`<th class="num">${esc(w.name)}</th>`).join(''):''}<th class="num">${all?'Всего':'Остаток'}</th>${Object.keys(TR).length?'<th class="num">В пути</th>':''}<th class="num">Мин.</th>${sc?'<th class="num">Себест.</th><th class="num">Сумма</th>':''}<th>Статус</th></tr></thead><tbody>
   ${(()=>{const rowH=({p,q,st})=>`<tr><td><span class="pname">${esc(p.name)}</span><span class="psku">${esc(p.sku||'')}${p.serial?` · <button class="btn link" style="padding:0;font-size:11.5px" data-act="sn-list" data-id="${esc(p.id)}">серийные номера</button>`:''}</span></td>${S.stockG?`<td class="muted">${esc(pgroup(p))}</td>`:''}<td>${esc(p.unit||'шт')}</td>${cols?whs.map(w=>`<td class="num">${q3(qty(w.id,p.id))}</td>`).join(''):''}<td class="num"><b>${q3(q)}</b></td>${Object.keys(TR).length?`<td class="num" style="color:var(--accent)">${TR[p.id]&&(all||TRW[p.id+':'+S.stockWh])?'+'+q3(all?TR[p.id]:TRW[p.id+':'+S.stockWh]):''}</td>`:''}<td class="num muted">${num(p.minStock)?q3(p.minStock):'—'}</td>${sc?`<td class="num">${NF.format(r2(cost(p.id)))}</td><td class="num">${NF.format(r2(Math.max(0,q)*cost(p.id)))}</td>`:''}<td><span class="chip ${st[0]}">${st[1]}</span></td></tr>`;const byG=!S.stockG;const ncol=(S.stockG?3:2)+(cols?whs.length:0)+1+(Object.keys(TR).length?1:0)+1+(sc?2:0)+1;const C=S.stockCol||(S.stockCol=new Set());
     const srt=byG?[...rows].sort((a,b)=>pgroup(a.p).localeCompare(pgroup(b.p),'ru')||(a.p.name||'').localeCompare(b.p.name||'','ru')):rows;let cur=null,out='';
     for(const r of srt){const g=pgroup(r.p);if(byG&&g!==cur){cur=g;const gr=srt.filter(x=>pgroup(x.p)===g);const gq=gr.reduce((a,x)=>a+Math.max(0,x.q),0);const gs=gr.reduce((a,x)=>a+Math.max(0,x.q)*cost(x.p.id),0);const cl=C.has(g)&&!f;
       out+=`<tr class="grp" data-act="stgrp" data-v="${esc(g)}" tabindex="0" aria-expanded="${!cl}"><td colspan="${ncol}"><span class="caret">${cl?'▸':'▾'}</span> ${esc(g)} <span class="gmeta">· ${gr.length} поз. · ${q3(gq)} шт${sc?' · '+money(gs):''}</span></td></tr>`}
       if(byG&&C.has(g)&&!f)continue;out+=rowH(r)}return out})()}</tbody></table>`:`<div class="empty">${allRows.length&&!S.stockZero&&!f?'На этом складе нет товаров в наличии. Включите «Показывать товары с нулевым остатком», чтобы увидеть весь список.':'Нет товаров по этим условиям'}</div>`}</div></section></div>`}
function snListModal(pid){const p=S.P[pid];const whs=S.stockWh==='all'?viewWh():[S.W[S.stockWh]].filter(Boolean);
  openModal(`<h2>${esc(p.name)}: серийные номера</h2>${whs.map(w=>{const a=snAt(w.id,pid);return `<div><h3 style="font-size:14px;margin-bottom:6px">${esc(w.name)} · ${a.length} шт</h3>${a.length?snChips(a):'<span class="muted small">Нет в наличии</span>'}</div>`}).join('')}
  <p class="muted small">Историю любого номера можно найти через поиск в «Журнале».</p><div class="row end"><button class="btn" data-act="modal-close">Закрыть</button></div>`)}

/* ---------- покупатели ---------- */
function vCustomers(){
  const f=S.cQ.trim().toLowerCase();const fd=f.replace(/\D/g,'');
  const KC=S.cKind||'all';const base=S.cust.filter(c=>KC==='all'||ckind(c)===KC);
  const list=base.filter(c=>(!f||(c.name||'').toLowerCase().includes(f)||(fd&&(c.phone||'').replace(/\D/g,'').includes(fd)))&&(!S.cDebtOnly||debtOf(c.id)>0.004))
    .sort((a,b)=>debtOf(b.id)-debtOf(a.id)||(a.name||'').localeCompare(b.name||'','ru'));
  const tot=base.reduce((s,c)=>s+Math.max(0,debtOf(c.id)),0),nD=base.filter(c=>debtOf(c.id)>0.004).length;
  const hist=new Set(S.sales.filter(o=>o.cust).map(o=>o.cust));
  return `<div class="stack">
  <div class="kpis"><div class="kpi main"><span>Покупатели должны</span><b>${money(tot)}</b></div><div class="kpi"><span>Должников</span><b>${nD}</b></div><div class="kpi"><span>${KC==='opt'?'Оптовых покупателей':KC==='retail'?'Розничных покупателей':'Покупателей в базе'}</span><b>${base.length}</b></div></div>
  <section class="pane"><div class="pane-h"><h2>Покупатели и долги</h2><button class="btn" data-act="cust-new"${roC()}>Добавить покупателя</button></div>
  <div class="seg" role="group" aria-label="Вид покупателей" style="margin-bottom:12px">${[['all','Все',S.cust.length],['retail','Розничные',S.cust.filter(c=>ckind(c)==='retail').length],['opt','Оптовые',S.cust.filter(c=>ckind(c)==='opt').length]].map(([k,v,n])=>`<button data-act="ckind" data-v="${k}" aria-pressed="${KC===k}">${v} <span class="muted">${n}</span></button>`).join('')}</div>
  <div class="row" style="margin-bottom:12px"><input id="cQ" data-in="cq" placeholder="Имя или телефон" value="${esc(S.cQ)}" style="flex:1 1 220px"><label class="check"><input type="checkbox" id="cDebtOnly" data-ch="cdebt"${S.cDebtOnly?' checked':''}> Только должники</label></div>
  <div class="tbl">${list.length?`<table><thead><tr><th>Покупатель</th><th class="num">Долг / предоплата</th><th class="num">Лимит</th><th>Последняя покупка</th><th></th></tr></thead><tbody>
  ${list.map(c=>{const d=debtOf(c.id),open=S.cOpen===c.id;return `<tr class="jrow" tabindex="0" data-act="copen" data-id="${esc(c.id)}" aria-expanded="${open}"><td><span class="pname">${esc(c.name)}${ckind(c)==='opt'?' <span class="chip t-move">опт</span>':''}</span><span class="psku">${esc(c.phone||'')}</span></td><td class="num ${d>0.004?'debt':''}">${d<-0.004?`<span style="color:var(--good)">предоплата ${money(-d)}</span>`:money(d)}</td><td class="num muted">${num(c.limit)?NF.format(c.limit):'—'}</td><td class="muted">${S.lastBuy[c.id]?ds(S.lastBuy[c.id]):'—'}</td>
   <td style="white-space:nowrap"><button class="btn link" data-act="pay-new" data-id="${esc(c.id)}"${ro('payments')}>${d>0.004?'Принять оплату':'Принять предоплату'}</button><button class="btn link" data-act="cust-edit" data-id="${esc(c.id)}"${canCust(ckind(c))?'':' disabled'}>Изменить</button>${canCust(ckind(c))&&!hist.has(c.id)?`<button class="btn link bad" data-act="cust-del" data-id="${esc(c.id)}">Удалить</button>`:''}</td></tr>
   ${open?`<tr class="jdet"><td colspan="5">${custHist(c)}</td></tr>`:''}`}).join('')}</tbody></table>`:`<div class="empty">${base.length?'Никого не найдено':S.cust.length?'В этой группе покупателей пока нет.':'Покупателей пока нет. Добавьте постоянных клиентов, чтобы продавать им в долг.'}</div>`}</div></section></div>`}
function custHist(c){
  const h=S.sales.filter(o=>o.cust===c.id).sort((a,b)=>(b.at||'').localeCompare(a.at||''));
  const note=c.note?`<p class="small muted" style="margin-bottom:8px">${esc(c.note)}</p>`:'';
  if(!h.length)return note+'<div class="muted small">Покупок пока не было</div>';
  return `${note}<div class="tbl"><table><thead><tr><th>Дата</th><th>Документ</th><th class="num">Сумма</th><th class="num">Оплачено</th><th class="num">Долг ±</th></tr></thead><tbody>
  ${h.slice(0,30).map(o=>{const nf=o.type==='ret'||o.type==='wx';const paid=o.type==='pay'?num(o.amount):nf?0:num(o.paid??o.total);const ch=o.type==='pay'?-num(o.amount):nf?0:num(o.total)-paid;return `<tr><td>${dt(o.at)}</td><td><span class="chip t-${o.type}">${tlabel(o)}</span> <span class="mono">${docNo(o)}</span></td><td class="num">${o.type==='sale'?NF.format(o.total):o.type==='ret'?'−'+NF.format(o.total):'—'}</td><td class="num">${NF.format(paid)} <span class="muted">${PAYL[o.pay]||''}</span></td><td class="num ${ch>0.004?'debt':''}">${ch>0?'+':''}${NF.format(r2(ch))}</td></tr>`}).join('')}</tbody></table></div>`}
function vParties(){if(!can('suppliers'))return vCustomers();
  return `<div class="stack"><div class="seg" role="group" aria-label="Контрагенты" style="align-self:flex-start">${[['cust','Покупатели'],['supp','Поставщики']].map(([k,v])=>`<button data-act="partytab" data-v="${k}" aria-pressed="${S.partyTab===k}">${v}</button>`).join('')}</div>${S.partyTab==='supp'?vSuppliers():vCustomers()}</div>`}
function vSuppliers(){
  const f=S.sQ.trim().toLowerCase();const fd=f.replace(/\D/g,'');
  const list=S.supp.filter(x=>!f||(x.name||'').toLowerCase().includes(f)||(x.inn||'').includes(f)||(fd.length>=3&&(x.phone||'').replace(/\D/g,'').includes(fd))).sort((a,b)=>supDebtOf(b.id)-supDebtOf(a.id)||(a.name||'').localeCompare(b.name||'','ru'));
  const tot=S.supp.reduce((a,x)=>a+Math.max(0,supDebtOf(x.id)),0);const from=Date.now()-30*864e5;
  const p30=S.ops.filter(o=>o.type==='in'&&o.supp&&new Date(o.at)>=from).reduce((a,o)=>a+docTotal(o),0);
  const used=new Set([...S.ops.filter(o=>o.supp).map(o=>o.supp),...S.spays.map(x=>x.supp)]);
  return `<div class="stack">
  <div class="kpis"><div class="kpi main"><span>Мы должны поставщикам</span><b>${money(tot)}</b></div><div class="kpi"><span>Закуплено за 30 дней</span><b>${money(p30)}</b></div><div class="kpi"><span>Поставщиков в базе</span><b>${S.supp.length}</b></div></div>
  <section class="pane"><div class="pane-h"><h2>Поставщики</h2><button class="btn" data-act="supp-new"${ro('suppliers')}>Добавить поставщика</button></div>
  <input id="sQ" data-in="sq" class="search" placeholder="Название, ИНН или телефон" value="${esc(S.sQ)}">
  <div class="tbl">${list.length?`<table><thead><tr><th>Поставщик</th><th>ИНН</th><th class="num">Наш долг / их долг</th><th>Последний приход</th><th></th></tr></thead><tbody>
  ${list.map(x=>{const d=supDebtOf(x.id),op=S.sOpen===x.id;return `<tr class="jrow" tabindex="0" data-act="sopen" data-id="${esc(x.id)}" aria-expanded="${op}"><td><span class="pname">${esc(x.name)}</span><span class="psku">${esc([x.contact,x.phone].filter(Boolean).join(' · '))}</span></td><td class="mono">${esc(x.inn||'—')}</td><td class="num ${d>0.004?'debt':''}">${d<-0.004?`<span style="color:var(--good)">должен нам ${money(-d)}</span>`:money(d)}</td><td class="muted">${S.supLast[x.id]?ds(S.supLast[x.id]):'—'}</td>
   <td style="white-space:nowrap">${d>0.004?`<button class="btn link" data-act="spay-new" data-id="${esc(x.id)}">Оплатить</button>`:''}<button class="btn link" data-act="supp-edit" data-id="${esc(x.id)}">Изменить</button>${used.has(x.id)?'':`<button class="btn link bad" data-act="supp-del" data-id="${esc(x.id)}">Удалить</button>`}</td></tr>
   ${op?`<tr class="jdet"><td colspan="5">${suppHist(x)}</td></tr>`:''}`}).join('')}</tbody></table>`:`<div class="empty">${S.supp.length?'Никого не найдено':'Поставщиков пока нет. Добавьте их здесь или прямо при оформлении прихода.'}</div>`}</div></section></div>`}
function suppHist(x){

  <div class="row"><label class="field"><span>Сумма к возврату, сом</span><input id="retAmt" data-in="retamt" inputmode="decimal"></label><label class="field"><span>Причина</span><input id="retWhy" placeholder="${claimId?'Гарантийный случай':'Не подошёл, брак'}"></label></div>

  <div class="row end"><button class="btn ghost" data-act="modal-close">Отмена</button><button class="btn danger" data-act="ret-save">Оформить возврат</button></div>`);

function updRet(){const R=S.retCtx;if(!R||R.amtEdited)return;let a=0;for(const l of R.lines){if(l.left<=0)continue;const q=(l.it.sn||[]).length?l.sel.length:num(l.q);a+=num(l.it.sum??num(l.it.q)*num(l.it.price))/num(l.it.q||1)*q}const e=$('#retAmt');if(e)e.value=r2(a)}
async function saveRet(){const R=S.retCtx;const o=S.all.find(x=>x.id===R.oid);const err=$('#retErr');err.textContent='';const items=[];
  for(const l of R.lines){if(l.left<=0)continue;const ser=(l.it.sn||[]).length>0;const q=ser?l.sel.length:r3(num(l.q));if(q<=0)continue;
    if(q>l.left+0.0005){err.textContent=`Нельзя вернуть больше, чем продано: ${pname(l.it.p)}`;return}
    const u=num(l.it.sum??num(l.it.q)*num(l.it.price))/num(l.it.q||1);const x={p:l.it.p,q,k:l.j,sum:r2(u*q)};if(ser)x.sn=[...l.sel];items.push(x)}
  if(!items.length){err.textContent='Отметьте, что возвращается';return}
  const amt=r2(num($('#retAmt').value));if(amt<0){err.textContent='Сумма не может быть отрицательной';return}
  const base=items.reduce((s,i)=>s+i.sum,0);if(base>0&&Math.abs(base-amt)>0.004)items.forEach(i=>i.sum=r2(i.sum*amt/base));
  const doc={type:'ret',at:now(),wh:o.wh,sale:o.id,items,total:amt,pay:R.pay,acc:R.pay==='cash'?accOf('cash'):($('#rtAcc')?.value||accOf(R.pay)),restock:$('#retStock').checked,cust:o.cust||null,party:$('#retWhy').value.trim(),by:S.uid||null};if(R.claimId)doc.claim=R.claimId;
  const ref=S.db.collection('sales').doc();
  const ok=await guard(async()=>{await ref.set(doc);if(R.claimId){const c=S.claims.find(x=>x.id===R.claimId);await S.db.collection('claims').doc(R.claimId).update({status:'ready',res:'refund',hist:[...(c?.hist||[]),{at:now(),st:'ready',res:'refund',note:`Возвращено ${money(amt)}`,by:S.uid||null}]})}},'Возврат оформлен','returns');
  if(ok){S.retCtx=null;closeModal(true);derive();render();showReceipt({id:ref.id,...doc})}}

function accList(){const a=S.set.accounts;return a&&a.length?a:[{id:'cash',name:'Касса (наличные)'},{id:'bank',name:'Банковский счёт'}]}
const accName=id=>accList().find(a=>a.id===id)?.name||'Счёт';
function accOf(pay){const m={cash:'cash',qr:'bank',transfer:'bank',card:'bank',...(S.set.payAcc||{})};const id=m[pay]||'cash';return accList().some(a=>a.id===id)?id:accList()[0].id}
const accFor=o=>o.acc&&accList().some(a=>a.id===o.acc)?o.acc:accOf(o.pay);
function accBox(pay,id,cur,label){if(pay==='cash')return '';const all=accList();const banks=all.filter(a=>a.id!=='cash');const list=banks.length?banks:all;const sel=cur&&list.some(a=>a.id===cur)?cur:accOf(pay);
  return `<label class="field"><span>${label||'Банк / счёт'}</span><select id="${id}" data-ch="${id.toLowerCase()}">${list.map(a=>`<option value="${esc(a.id)}"${a.id===sel?' selected':''}>${esc(a.name)}</option>`).join('')}</select></label>${banks.length<2&&S.isOwner?'<span class="muted small">Чтобы выбирать между банками, добавьте их во вкладке «Деньги» → «Настроить счета».</span>':''}`}
function moneyEvents(){const E=[];const push=(o,acc,amt,label,desc,x)=>E.push({at:o.at,acc,amt,label,desc,o,...(x||{})});
  for(const o of S.sales){if(o.type==='sale'){const p=num(o.paid??o.total);if(p)push(o,accFor(o),p,'Продажа',docNo(o)+(o.cust?' · '+cname(o.cust):''))}
    else if(o.type==='pay')push(o,accFor(o),num(o.amount),o.out?'Выдача клиенту':o.adv?'Предоплата':'Оплата долга',cname(o.cust)+(o.out&&o.party?' · '+o.party:''));
    else if(o.type==='ret'&&num(o.total))push(o,accFor(o),-num(o.total),'Возврат покупателю',docNo(o))}
  for(const o of S.spays)push(o,accFor(o),-num(o.amount),o.back?'Возврат от поставщика':o.lend?'Выдача поставщику':'Оплата поставщику',sname(o.supp)+(o.party?' · '+o.party:''));
  for(const o of S.ops){if(o.type!=='in')continue;const oc=S.opc[o.id];if(oc&&oc.ppay&&num(oc.paid)>0)push(o,oc.ppay,-num(oc.paid),'Оплата прихода',docNo(o)+(o.party?' · '+o.party:''));if(oc&&num(oc.dlv)>0&&oc.dlvAcc)push(o,oc.dlvAcc,-num(oc.dlv),'Доставка товара',docNo(o)+(o.party?' · '+o.party:''))}
  for(const o of S.moneyL){const d=[o.cat,o.note].filter(Boolean).join(' · ');
    if(o.kind==='in')push(o,o.acc,num(o.amount),'Приход денег',d,{own:1});else if(o.kind==='out')push(o,o.acc,-num(o.amount),'Расход',d,{own:1,cat:o.cat||'Прочее'});
    else if(o.kind==='move'){push(o,o.acc,-num(o.amount),'Перевод',`в «${accName(o.to)}»`+(o.note?' · '+o.note:''),{own:1,mv:1});push(o,o.to,num(o.amount),'Перевод',`из «${accName(o.acc)}»`+(o.note?' · '+o.note:''),{own:1,mv:1})}
    else if(o.kind==='set')push(o,o.acc,0,'Пересчёт остатка',o.note||'',{own:1,set:num(o.amount)})}
  E.sort((a,b)=>(a.at||'').localeCompare(b.at||''));const bal={};for(const e of E){const b=bal[e.acc]||0;if(e.set!=null){e.amt=r2(e.set-b);bal[e.acc]=e.set}else bal[e.acc]=r2(b+e.amt);e.bal=bal[e.acc]}return{E,bal}}

function calcPL(rg){let rev=0,cogs=0;for(const o of S.all){if(!inR(o,rg))continue;const dc=(o.items||[]).reduce((a,i,k)=>a+num(i.q)*icost(o,k),0);

  const exp=S.moneyL.filter(m=>m.kind==='out'&&inR(m,rg)).reduce((a,m)=>a+num(m.amount),0);return{rev,cogs,gross:rev-cogs,exp,net:rev-cogs-exp}}
const ymKey=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;

    sumTxt=Object.entries(byY).filter(([,v])=>v).map(([y,v])=>`${y}: <b style="color:${v<0?'var(--bad)':'var(--good)'}">${money(v)}</b>`).join(' · ')}
  else{const last=mode===cy?cm:11;for(let m=0;m<=last;m++){const x=plMonth(mode,m);P.push({v:x[key],l:MSH[m],t:MSH[m]+' '+mode})}
    labels=MSH.slice();

    const a=P.reduce((s,p)=>s+p.v,0);sumTxt=`За ${mode}: <b style="color:${a<0?'var(--bad)':'var(--good)'}">${money(a)}</b>`+(Q?` · за ${mode-1}: <b>${money(Q.reduce((s,p)=>s+p.v,0))}</b>`:'')}

  const vals=[...P.map(p=>p.v),...(Q||[]).map(q=>q.v),0];const mxv=Math.max(...vals),mnv=Math.min(...vals);
  const stp=niceMax(Math.max(1,(Math.max(mxv,0)-Math.min(mnv,0))/4));let hi=Math.max(stp,Math.ceil(mxv/stp)*stp),lo=Math.min(0,Math.floor(mnv/stp)*stp);let hi_=hi,lo_=lo;if(mxv>0&&hi-mxv<stp*.2)hi_+=stp;if(mnv<0&&mnv-lo<stp*.25)lo_-=stp;hi=hi_;lo=lo_;const nG=Math.round((hi-lo)/stp);

  const step=Math.ceil(N/Math.max(4,Math.floor(W/70)));let xl='';for(let i=0;i<N;i++)if(i%step===0&&labels[i])xl+=`<text x="${x(i)}" y="${H-12}" text-anchor="middle">${esc(labels[i])}</text>`;
  const path=A=>A.map((p,i)=>`${i?'L':'M'}${x(i).toFixed(1)},${y(p.v).toFixed(1)}`).join('');

async function modSave(){const m=S.mod,err=$('#modErr');err.textContent='';const parts=S.pcComp[m.pc]||[];
  if(!pcIn(m.pc)||pcWh(m.pc)!==m.wh){err.textContent='Компьютер уже перемещён или продан, откройте его заново';return}
  const rem=[];for(const [i,q] of Object.entries(m.rem)){const x=parts[+i];if(!x)continue;if((x.sn||[]).length)rem.push({p:x.p,q:1,sn:[...x.sn]});else{const qq=Math.min(num(x.q),num(q));if(qq>0){const r={p:x.p,q:r3(qq)};if(qq>=num(x.q)&&(x.rsn||[]).length)r.rsn=[...x.rsn];rem.push(r)}}}
  const add=[];for(const x of m.add){if(S.P[x.p]?.serial){if(!x.sn.length){err.textContent=`Отметьте номер для «${pname(x.p)}»`;return}add.push({p:x.p,q:x.sn.length,sn:[...x.sn]})}else{const q=r3(num(x.q));if(q<=0){err.textContent='Количество должно быть больше нуля';return}const r=snParse(x.rsn||'');const a={p:x.p,q};if(r.length)a.rsn=r;add.push(a)}}
  if(!rem.length&&!add.length){err.textContent='Отметьте, что снять или установить';return}
  const need={};add.forEach(i=>need[i.p]=(need[i.p]||0)+i.q);for(const k in need)if(need[k]>qty(m.wh,k)+0.0005){err.textContent=`Недостаточно «${pname(k)}» на складе`;return}
  for(const a of add)for(const z of (a.sn||[]))if(S.snLoc[z]?.wh!==m.wh){err.textContent=`Номер ${z} не числится на этом складе`;return}
  const doc={type:'mod',at:now(),wh:m.wh,pc:m.pc,asm:S.pca[m.pc].id,add,rem,party:m.note.trim(),by:S.uid||null};const ref=S.db.collection('ops').doc();
  if(await guard(()=>ref.set(doc),'Комплектация изменена',pcNeed())){S.mod=null;closeModal(true);if(!S.ops.some(x=>x.id===ref.id)){S.ops.push({id:ref.id,...doc});derive()}render()}}

  if(!list.length)return '<option value="">На складе нет деталей'+(S.asmG?' в этой группе':'')+'</option>';

function updAsm(){const box=$('#asmSum');const a=S.asm;let parts=0,n=0;a.items.forEach((it,i)=>{const q=S.P[it.p]?.serial?(it.sn||[]).length:num(it.q);const v=q*cost(it.p);parts+=v;n+=q;const e=$('#asum'+i);if(e)e.textContent=NF.format(r2(v))});
  if(!box)return;const lab=num(a.labor),tot=parts+lab,pr=num(a.price)||num(S.P[a.out]?.sellPrice),pf=pr-tot;
  box.innerHTML=`<div class="kpi"><span>Детали, ${q3(n)} шт</span><b>${money(parts)}</b></div><div class="kpi"><span>Работа по сборке</span><b>${money(lab)}</b></div><div class="kpi main"><span>Себестоимость компьютера</span><b>${money(tot)}</b></div>${pr?`<div class="kpi"><span>${num(a.price)?'При цене':'При цене модели'} ${money(pr)}</span><b style="color:${pf<0?'var(--bad)':'var(--good)'}">${pf<0?'убыток':'прибыль'} ${money(Math.abs(pf))}${tot?` · ${NF.format(r2(pf/tot*100))}%`:''}</b></div>`:''}`}
async function postAsm(){const a=S.asm,err=$('#asmErr');err.textContent='';
  if(!a.out){err.textContent='Выберите модель компьютера';return}
  const sn=a.sn.trim();if(!sn){err.textContent='Укажите серийный номер компьютера или нажмите «Создать»';return}
  if(S.snH[sn]){err.textContent='Такой серийный номер уже есть';return}
  if(!a.items.length){err.textContent='Добавьте детали';return}
  a.items.forEach(i=>{if(S.P[i.p]?.serial)i.q=(i.sn||[]).length});
  if(a.items.some(i=>S.P[i.p]?.serial&&!(i.sn||[]).length)){err.textContent='Выберите серийные номера деталей со склада';return}
  if(a.items.some(i=>num(i.q)<=0)){err.textContent='Количество должно быть больше нуля';return}
  const need={};a.items.forEach(i=>need[i.p]=(need[i.p]||0)+num(i.q));
  for(const x in need)if(r3(need[x])>qty(a.wh,x)){err.textContent=`Недостаточно «${pname(x)}» на складе: ${q3(qty(a.wh,x))}`;return}
  for(const i of a.items)for(const x of (i.sn||[]))if(S.snLoc[x]?.wh!==a.wh){err.textContent=`Номер ${x} не числится на этом складе`;return}
  const items=a.items.map(i=>{const it={p:i.p,q:r3(num(i.q))};if((i.sn||[]).length)it.sn=[...i.sn];const r=snParse(i.rsn||'');if(r.length)it.rsn=r;return it});
  const doc={type:'asm',at:now(),wh:a.wh,items,out:{p:a.out,sn:[sn]},party:a.note.trim(),by:S.uid||null};if(num(a.price)>0)doc.price=r2(num(a.price));
  const labor=can('cost')?r2(num(a.labor)):0;const ref=S.db.collection('ops').doc();
  const ok=await guard(async()=>{if(labor>0){await S.db.collection('opcosts').doc(ref.id).set({labor});if(!S.opc[ref.id])S.opcL.push({id:ref.id,labor})}await ref.set(doc)},'Компьютер собран','assembly');
  if(ok){S.asm={wh:a.wh,out:a.out,sn:'',note:'',labor:'',price:'',items:[]};S.asmOpen=sn;S.asmF='';if(!S.ops.some(x=>x.id===ref.id)){S.ops.push({id:ref.id,...doc});derive()}render()}}

  return Object.values(g)}
function vCons(){const sc=can('cost');const rows=consRows();const F=S.consF||'open';

  const sups=[...new Set(rows.map(r=>r.supp))];const owe=sups.reduce((a,x)=>a+Math.max(0,supDebtOf(x)),0);

  return `<div class="stack"><section class="pane stack"><div class="pane-h" style="margin:0">${opSeg()}<span class="muted">Товар, взятый у поставщиков под реализацию</span></div>

  const doc={type:m,at:now(),wh:o.wh,items,party:m==='move'?'':m==='in'?(init?'Ввод остатков':o.supp?sname(o.supp):''):o.party.trim(),by:S.uid||null};
  if(m==='in'&&o.supp&&!init)doc.supp=o.supp;if(init)doc.init=true;if(m==='in'&&o.po)doc.po=o.po;if(cons)doc.cons=true;
  if(m==='move')doc.toWh=o.toWh;
  const ref=S.db.collection('ops').doc();
  const ok=await guard(async()=>{
    if(m==='in'){const oc={items:prices,total:tot,paid,...(o.po||cons||init?{}:{ppay:o.ppay||'cash'}),...(cons?{cons:true}:{}),...(init?{init:true}:{}),...(dlv>0?{dlv,dlvBy:o.dlvBy||'sum',dlvAcc:o.dlvAcc||'cash'}:{})};await S.db.collection('opcosts').doc(ref.id).set(oc);if(!S.opc[ref.id]){S.opcL.push({id:ref.id,...oc})}}

function chartSvg(B,sc){
  const W=Math.round(Math.max(320,Math.min(1300,($('#view')?.clientWidth||760)-38))),H=Math.round(Math.min(300,Math.max(210,W*.3))),pl=58,pr=10,pt=12,pb=34,iw=W-pl-pr,ih=H-pt-pb;
  const mx=niceMax(Math.max(1,...B.map(b=>b.rev)));const mn=sc?Math.min(0,...B.map(b=>b.prof)):0;const lo=mn<0?-niceMax(-mn):0;
  const y=v=>pt+ih*(1-(v-lo)/(mx-lo));const bw=iw/B.length;const step=Math.ceil(B.length/Math.max(4,Math.floor(W/90)));
  let g='';for(let k=0;k<=4;k++){const v=lo+(mx-lo)*k/4;g+=`<line x1="${pl}" x2="${W-pr}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" stroke-width="1"/><text x="${pl-8}" y="${y(v)+4}" text-anchor="end">${NC.format(v)}</text>`}
  let bars='';B.forEach((b,i)=>{const x=pl+i*bw+bw*.14,w=Math.max(1,bw*.72);
    bars+=`<rect x="${x}" y="${y(b.rev)}" width="${w}" height="${Math.max(0,y(0)-y(b.rev))}" fill="var(--accent-soft)" rx="2"><title>${esc(b.l)}: выручка ${money(b.rev)}${sc?', прибыль '+money(b.prof):''}</title></rect>`;
    if(sc){const pf=b.prof;bars+=`<rect x="${x+w*.22}" y="${pf>=0?y(pf):y(0)}" width="${w*.56}" height="${Math.abs(y(pf)-y(0))}" fill="${pf>=0?'var(--accent)':'var(--bad)'}" rx="1.5" pointer-events="none"/>`}
    if(i%step===0)bars+=`<text x="${pl+i*bw+bw/2}" y="${H-12}" text-anchor="middle">${esc(b.l)}</text>`});
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="График выручки">${g}<line x1="${pl}" x2="${W-pr}" y1="${y(0)}" y2="${y(0)}" stroke="var(--muted)" stroke-width="1"/>${bars}</svg>`}

/* ---------- чтение Excel (.xls BIFF8, .xlsx) и CSV без внешних библиотек ---------- */
function cfbStream(u8,names){const dv=new DataView(u8.buffer,u8.byteOffset,u8.byteLength);
  if(dv.getUint32(0,true)!==0xE011CFD0)return null;
  const ss=1<<dv.getUint16(30,true),ms=1<<dv.getUint16(32,true),nFat=dv.getUint32(44,true),dir0=dv.getUint32(48,true),cut=dv.getUint32(56,true),mf0=dv.getUint32(60,true);
  let difat=[];for(let i=0;i<109;i++)difat.push(dv.getUint32(76+i*4,true));
  let dsec=dv.getUint32(68,true),nd=dv.getUint32(72,true);
  const off=s=>512+s*ss;
  while(nd-->0&&dsec<0xFFFFFFFA){for(let i=0;i<ss/4-1;i++)difat.push(dv.getUint32(off(dsec)+i*4,true));dsec=dv.getUint32(off(dsec)+ss-4,true)}
  difat=difat.slice(0,nFat).filter(x=>x<0xFFFFFFFA);
  const fat=[];for(const s of difat)for(let i=0;i<ss/4;i++)fat.push(dv.getUint32(off(s)+i*4,true));
  const chain=(s,F)=>{const r=[];let g=0;while(s<0xFFFFFFFA&&g++<1e6){r.push(s);s=F[s]}return r};
  const readBig=(s,size)=>{const c=chain(s,fat);const out=new Uint8Array(c.length*ss);c.forEach((x,i)=>out.set(u8.subarray(off(x),off(x)+ss),i*ss));return size!=null?out.subarray(0,size):out};
  const dir=readBig(dir0);const dd=new DataView(dir.buffer);const ents=[];
  for(let p=0;p+128<=dir.length;p+=128){const nl=dd.getUint16(p+64,true);let nm='';for(let i=0;i<Math.max(0,nl/2-1);i++)nm+=String.fromCharCode(dd.getUint16(p+i*2,true));ents.push({nm,type:dir[p+66],start:dd.getUint32(p+116,true),size:dd.getUint32(p+120,true)})}
  const e=ents.find(x=>x.type===2&&names.includes(x.nm));if(!e)return null;
  if(e.size>=cut)return readBig(e.start,e.size);
  const root=ents.find(x=>x.type===5);const mstream=readBig(root.start);const mfat=[];for(const s of chain(mf0,fat))for(let i=0;i<ss/4;i++)mfat.push(dv.getUint32(off(s)+i*4,true));
  const c=chain(e.start,mfat);const out=new Uint8Array(c.length*ms);c.forEach((x,i)=>out.set(mstream.subarray(x*ms,x*ms+ms),i*ms));return out.subarray(0,e.size)}
function xlsRows(u8){const wb=cfbStream(u8,['Workbook','Book']);if(!wb)throw new Error('Не удалось прочитать файл .xls');
  const dv=new DataView(wb.buffer,wb.byteOffset,wb.byteLength);const recs=[];
  for(let p=0;p+4<=wb.length;){const t=dv.getUint16(p,true),l=dv.getUint16(p+2,true);recs.push({t,p:p+4,l});p+=4+l}
  const sst=[];const rows=[];let sheetN=0,inSheet=false,done=false;let pendStr=null;
  const rk=v=>{let n;if(v&2){n=v>>2}else{const b=new DataView(new ArrayBuffer(8));b.setUint32(4,v&0xFFFFFFFC,true);b.setUint32(0,0,true);n=b.getFloat64(0,true)}return v&1?n/100:n};
  const put=(r,c,v)=>{if(!inSheet||done)return;(rows[r]??=[])[c]=v};
  const dec=(bytes,wide)=>{let s='';if(wide){for(let i=0;i+1<bytes.length;i+=2)s+=String.fromCharCode(bytes[i]|bytes[i+1]<<8)}else for(const b of bytes)s+=String.fromCharCode(b);return s};
  function parseSST(i0){const parts=[wb.subarray(recs[i0].p,recs[i0].p+recs[i0].l)];let j=i0+1;while(j<recs.length&&recs[j].t===0x3C){parts.push(wb.subarray(recs[j].p,recs[j].p+recs[j].l));j++}
    let pi=0,pos=8;const cur=()=>parts[pi];
    const need=n=>{if(pos+n>cur().length&&pos>=cur().length){pi++;pos=0}};
    const u8r=()=>{need(1);return cur()[pos++]};const u16=()=>{need(2);const v=cur()[pos]|cur()[pos+1]<<8;pos+=2;return v};const u32=()=>{need(4);const a=cur();const v=(a[pos]|a[pos+1]<<8|a[pos+2]<<16)+a[pos+3]*16777216;pos+=4;return v};
    const total=new DataView(parts[0].buffer,parts[0].byteOffset).getUint32(4,true);
    for(let k=0;k<total&&pi<parts.length;k++){if(pos>=cur().length){pi++;pos=0;if(pi>=parts.length)break}
      let cch=u16(),fl=u8r();let rt=0,sz=0;if(fl&8)rt=u16();if(fl&4)sz=u32();let s='';let wide=fl&1;
      while(cch>0){if(pos>=cur().length){pi++;pos=0;if(pi>=parts.length)break;wide=cur()[pos++]&1}
        const avail=wide?Math.floor((cur().length-pos)/2):cur().length-pos;const n=Math.min(cch,avail);s+=dec(cur().subarray(pos,pos+n*(wide?2:1)),wide);pos+=n*(wide?2:1);cch-=n}
      let skip=rt*4+sz;while(skip>0){if(pos>=cur().length){pi++;pos=0;if(pi>=parts.length)break}const n=Math.min(skip,cur().length-pos);pos+=n;skip-=n}

    if(t===0x809){const typ=dv.getUint16(p+2,true);if(typ===0x10){sheetN++;inSheet=sheetN===1}else inSheet=false;continue}
    if(t===0x0A){if(inSheet)done=true;inSheet=false;continue}
    if(t===0xFC){parseSST(i);continue}
    if(!inSheet||done)continue;
    const r=dv.getUint16(p,true),c=dv.getUint16(p+2,true);
    if(t===0xFD)put(r,c,sst[dv.getUint32(p+6,true)]??'');
    else if(t===0x203)put(r,c,dv.getFloat64(p+6,true));
    else if(t===0x27E)put(r,c,rk(dv.getUint32(p+6,true)));
    else if(t===0xBD){const last=dv.getUint16(p+l-2,true);for(let k=0;c+k<=last;k++)put(r,c+k,rk(dv.getUint32(p+4+k*6+2,true)))}
    else if(t===0x204){const n=dv.getUint16(p+6,true);const w=wb[p+8]&1;put(r,c,dec(wb.subarray(p+9,p+9+n*(w?2:1)),w))}
    else if(t===0x06){if(dv.getUint16(p+12,true)===0xFFFF){if(wb[p+6]===0){lastF=[r,c]}}else put(r,c,dv.getFloat64(p+6,true))}
    else if(t===0x207&&lastF){const n=dv.getUint16(p,true);const w=wb[p+2]&1;put(lastF[0],lastF[1],dec(wb.subarray(p+3,p+3+n*(w?2:1)),w));lastF=null}}
  return rows.map(r=>r||[])}
async function unzipEntries(u8){const dv=new DataView(u8.buffer,u8.byteOffset,u8.byteLength);let e=u8.length-22;while(e>=0&&dv.getUint32(e,true)!==0x06054b50)e--;if(e<0)throw new Error('Повреждённый файл');
  const n=dv.getUint16(e+10,true);let p=dv.getUint32(e+16,true);const out={};
  for(let i=0;i<n;i++){const meth=dv.getUint16(p+10,true),csz=dv.getUint32(p+20,true),nl=dv.getUint16(p+28,true),xl=dv.getUint16(p+30,true),cl=dv.getUint16(p+32,true),lo=dv.getUint32(p+42,true);
    const name=new TextDecoder().decode(u8.subarray(p+46,p+46+nl));const ds=lo+30+dv.getUint16(lo+26,true)+dv.getUint16(lo+28,true);out[name]={meth,data:u8.subarray(ds,ds+csz)};p+=46+nl+xl+cl}

async function inflate(x){if(x.meth===0)return x.data;const s=new Blob([x.data]).stream().pipeThrough(new DecompressionStream('deflate-raw'));return new Uint8Array(await new Response(s).arrayBuffer())}
async function xlsxRows(u8){const z=await unzipEntries(u8);const txt=async n=>z[n]?new TextDecoder().decode(await inflate(z[n])):'';
  const P=s=>new DOMParser().parseFromString(s,'application/xml');
  const ss=[...P(await txt('xl/sharedStrings.xml')).getElementsByTagName('si')].map(si=>[...si.getElementsByTagName('t')].map(t=>t.textContent).join(''));
  const wbx=P(await txt('xl/workbook.xml'));const rels=P(await txt('xl/_rels/workbook.xml.rels'));const sh=wbx.getElementsByTagName('sheet')[0];
  let path='xl/worksheets/sheet1.xml';if(sh){const rid=sh.getAttribute('r:id')||sh.getAttributeNS('http://schemas.openxmlformats.org/officeDocument/2006/relationships','id');const rel=[...rels.getElementsByTagName('Relationship')].find(r=>r.getAttribute('Id')===rid);if(rel){const t=rel.getAttribute('Target');path=t.startsWith('/')?t.slice(1):'xl/'+t.replace(/^\.\//,'')}}
  const doc=P(await txt(path));const rows=[];const col=ref=>{let n=0;for(const ch of ref.replace(/\d+/g,''))n=n*26+ch.charCodeAt(0)-64;return n-1};
  for(const r of doc.getElementsByTagName('row')){const ri=num(r.getAttribute('r'))-1;const row=rows[ri]=[];
    for(const c of r.getElementsByTagName('c')){const t=c.getAttribute('t'),v=c.getElementsByTagName('v')[0]?.textContent;let val;
      if(t==='s')val=ss[num(v)];else if(t==='inlineStr')val=[...c.getElementsByTagName('t')].map(x=>x.textContent).join('');else if(t==='str'||t==='e')val=v??'';else if(v!=null)val=t==='b'?v:parseFloat(v);
      if(val!=null)row[col(c.getAttribute('r'))]=val}}
  return [...rows].map(r=>r||[])}
function csvRows(text){const sep=(text.split('\n')[0].match(/;/g)||[]).length>(text.split('\n')[0].match(/,/g)||[]).length?';':',';const rows=[];let row=[],cell='',q=false;
  for(let i=0;i<text.length;i++){const ch=text[i];if(q){if(ch==='"'){if(text[i+1]==='"'){cell+='"';i++}else q=false}else cell+=ch}
    else if(ch==='"')q=true;else if(ch===sep){row.push(cell);cell=''}else if(ch==='\n'||ch==='\r'){if(ch==='\r'&&text[i+1]==='\n')i++;row.push(cell);rows.push(row);row=[];cell=''}else cell+=ch}
  if(cell||row.length){row.push(cell);rows.push(row)}return rows}
async function readSheet(file){const u8=new Uint8Array(await file.arrayBuffer());
  if(u8[0]===0xD0&&u8[1]===0xCF)return xlsRows(u8);
  if(u8[0]===0x50&&u8[1]===0x4B)return xlsxRows(u8);
  let t=new TextDecoder('utf-8').decode(u8);if(t.includes('�'))t=new TextDecoder('windows-1251').decode(u8);

/* ---------- загрузка остатков из Excel ---------- */
function impParse(rows){const low=v=>String(v??'').trim().toLowerCase();let h=-1,C={};
  for(let i=0;i<Math.min(rows.length,40)&&h<0;i++){const r=rows[i]||[];const m={};r.forEach((v,j)=>{const t=low(v).replace(/\s+/g,' ');if(!t)return;
      if(m.name==null&&/наименование|название|номенклатура|^товар/.test(t))m.name=j;
      else if(m.code==null&&/^код/.test(t)&&!/штрих/.test(t))m.code=j;
      else if(m.sku==null&&/артикул/.test(t))m.sku=j;
      else if(m.qty==null&&/остат|кол-?во|количеств/.test(t)&&!/сумм/.test(t))m.qty=j;
      else if(m.cost==null&&/себестоим|закуп|входящ/.test(t)&&!/сумм/.test(t))m.cost=j;
      else if(m.price==null&&/цена|розн|продаж/.test(t)&&!/сумм|закуп|себест/.test(t))m.price=j;
      else if(m.group==null&&/групп|категор/.test(t))m.group=j});
    if(m.name!=null&&m.qty!=null){h=i;C=m}}
  if(h<0)return{err:'Не нашёл в файле строку заголовков с колонками «Наименование» и «Остаток» (или «Количество»).'};
  const items=[];let grp='';const isNum=v=>typeof v==='number'||(/^-?[\d\s]+([.,]\d+)?$/.test(String(v??'').trim())&&String(v).trim()!=='');
  for(let i=h+1;i<rows.length;i++){const r=rows[i]||[];const name=String(r[C.name]??'').trim();
    if(!name){const nums=r.filter(v=>isNum(v)&&num(v)!==0).length;const txt=r.find(v=>typeof v==='string'&&v.trim()&&!isNum(v));if(txt&&!nums)grp=txt.trim();continue}
    if(/^итого|^всего/i.test(name))continue;
    const code=String(r[C.code]??r[C.sku]??'').trim();const sku=String(r[C.sku]??'').trim()||code;
    items.push({name,sku,group:C.group!=null&&String(r[C.group]??'').trim()?String(r[C.group]).trim():grp,qty:r3(num(r[C.qty])),cost:r2(num(r[C.cost])),price:r2(num(r[C.price])),row:i+1})}
  return{items,cols:C}}
function impMatch(it){const s=it.sku.toLowerCase(),n=it.name.toLowerCase();return (s&&S.prod.find(p=>(p.sku||'').toLowerCase()===s))||S.prod.find(p=>(p.name||'').trim().toLowerCase()===n)||null}
function impPlan(){const I=S.imp;const gNew=new Set();let nNew=0,nOld=0,q=0,sum=0;const skip=[],warn=[];
  for(const it of I.items){it.p=impMatch(it);it.why='';
    if(it.qty<=0){it.why='остаток 0 — не загружается';skip.push(it);continue}
    if(it.p&&it.p.serial){it.why='серийный товар — нужны S/N, введите вручную';skip.push(it);continue}
    if(it.p)nOld++;else{nNew++;if(it.group&&!S.groups.some(g=>(g.name||'').toLowerCase()===it.group.toLowerCase()))gNew.add(it.group)}
    if(!it.price&&!(it.p&&num(it.p.sellPrice)))warn.push(it);q+=it.qty;sum+=it.qty*it.cost}
  return{gNew,nNew,nOld,q,sum,skip,warn,ok:I.items.filter(x=>!x.why)}}

  let body='';

    ${(()=>{const h=P.ok.filter(x=>x.p&&qty(I.wh,x.p.id)>0);return h.length?`<div class="banner" style="margin:0"><b>Внимание:</b> у ${h.length} товаров уже есть остаток на складе «${esc(wname(I.wh))}» — количество из файла прибавится к нему. Если вы уже загружали этот файл, не загружайте его повторно.</div>`:''})()}
    ${P.warn.length?`<div class="infobox">Без цены продажи (${P.warn.length}): ${P.warn.slice(0,6).map(x=>esc(x.name)).join(', ')}${P.warn.length>6?' и др.':''}. Цену можно поставить потом в «Товары и склады».</div>`:''}

    <div class="tbl" style="max-height:340px;overflow:auto"><table><thead><tr><th>Товар</th><th>Группа</th><th class="num">Остаток</th><th class="num">Себест.</th><th class="num">Цена</th><th></th></tr></thead><tbody>
    ${I.items.map(x=>`<tr${x.why?' style="opacity:.5"':''}><td><span class="pname">${esc(x.name)}</span><span class="psku">${esc(x.sku)}</span></td><td class="small">${esc(x.group||'—')}</td><td class="num">${q3(x.qty)}</td><td class="num">${NF.format(x.cost)}</td><td class="num">${x.price?NF.format(x.price):'<span class="muted">—</span>'}</td><td>${x.why?`<span class="chip out">пропуск</span>`:x.p?'<span class="chip t-move">есть</span>':'<span class="chip ok">новый</span>'}</td></tr>`).join('')}</tbody></table></div>`}
  openModal(`<h2>Загрузка остатков из Excel</h2>
  <label class="field" style="flex:none"><span>На какой склад</span><select data-ch="imp-wh">${whOpts}</select></label>
  ${body}<div class="err" id="impErr"></div>
  <div class="row end"><button class="btn ghost" data-act="modal-close">Отмена</button>${I.items.length?`<button class="btn ghost" data-act="imp-reset">Другой файл</button><button class="btn" data-act="imp-run"${I.plan?.ok.length?'':' disabled'}>Загрузить ${I.plan?.ok.length||0} товаров</button>`:''}</div>`);
  $('#mcard').classList.add('wide')}
async function impFileStock(t){const f=t.files?.[0];if(!f)return;const I=S.imp;I.err='';
  try{const rows=await readSheet(f);const r=impParse(rows);if(r.err){I.err=r.err;I.items=[]}else if(!r.items.length){I.err='В файле не найдено ни одного товара.';I.items=[]}else{I.items=r.items;I.file=f.name}}
  catch(e){I.err='Не удалось прочитать файл: '+(e?.message||e)+'. Попробуйте сохранить его в Excel как .xlsx.'}
  impRender()}
async function impRunStock(){const I=S.imp;if(!I?.plan)return;const P=I.plan;if(!can('stock')||!can('catalog')){toast('Нужны права «Приход» и «Товары, группы и склады»');return}
  if(!I.wh||!S.W[I.wh]){$('#impErr').textContent='Выберите склад';return}
  const db=S.db;const W=[];const set=(path,d)=>W.push(['set',path,d]);const upd=(path,d)=>W.push(['update',path,d]);
  const gid={};S.groups.forEach(g=>gid[(g.name||'').toLowerCase()]=g.id);
  for(const g of P.gNew){const id=db.collection('groups').doc().id;gid[g.toLowerCase()]=id;set('groups/'+id,{name:g,serial:false,createdAt:now()})}
  const items=[],prices=[];const at=now();
  for(const x of P.ok){let pid=x.p?.id;
    if(!pid){pid=db.collection('products').doc().id;const g=x.group?gid[x.group.toLowerCase()]||null:null;
      set('products/'+pid,{name:x.name,sku:x.sku,group:g,cat:g?x.group:'',unit:'шт',minStock:0,sellPrice:x.price,serial:false,warranty:0,archived:false,createdAt:at})}
    else if(I.upd&&x.price&&num(x.p.sellPrice)!==x.price)upd('products/'+pid,{sellPrice:x.price});
    if(!S.costs[pid]||num(S.costs[pid].buyPrice)!==x.cost)set('costs/'+pid,{buyPrice:x.cost});
    items.push({p:pid,q:x.qty});prices.push({p:pid,price:x.cost})}
  const opId=db.collection('ops').doc().id;const tot=r2(items.reduce((a,it,k)=>a+it.q*prices[k].price,0));
  set('opcosts/'+opId,{items:prices,total:tot,paid:0,init:true});
  set('ops/'+opId,{type:'in',at,wh:I.wh,items,party:'Ввод остатков · '+I.file,init:true,by:S.uid||null});
  const btn=$('[data-act=imp-run]');if(btn){btn.disabled=true;btn.textContent='Загружаю…'}
  const ok=await guard(async()=>{
    if(db.batch){for(let i=0;i<W.length;i+=400){const b=db.batch();for(const [op,path,d] of W.slice(i,i+400))op==='set'?b.set(db.doc(path),d):b.update(db.doc(path),d);await b.commit()}}
    else{let n=0;for(const [op,path,d] of W){await (op==='set'?db.doc(path).set(d):db.doc(path).update(d));if(++n%25===0&&btn)btn.textContent=`Загружаю… ${Math.round(n/W.length*100)}%`}}},
    `Загружено: ${items.length} товаров, ${q3(P.q)} шт на «${wname(I.wh)}»`,'stock');
  if(ok){S.imp=null;closeModal(true);render()}else if(btn){btn.disabled=false;btn.textContent='Повторить загрузку'}}

function snConvDocs(pid){const ins=[],bad=[];for(const o of S.all){const ref=(o.items||[]).some(i=>i.p===pid)||(o.add||[]).some(x=>x.p===pid)||(o.rem||[]).some(x=>x.p===pid)||o.out?.p===pid;if(!ref)continue;if(o.type==='in'&&S.ops.includes(o))ins.push(o);else bad.push(o)}return{ins,bad}}

function snConvForm(pid){const p=S.P[pid];const c=snConvDocs(pid);if(c.bad.length||!c.ins.length){toast('По товару уже есть продажи или другие документы — перевести нельзя');return}

  <div class="row end"><button class="btn ghost" data-act="modal-close">Отмена</button><button class="btn" data-act="sncv-save">Сохранить номера</button></div>`);$('#mcard').classList.add('wide')}
async function snConvSave(){const C=S.snConv;if(!C)return;const err=$('#sncvErr');err.textContent='';const all=new Set();const lists=[];
  for(let i=0;i<C.blocks.length;i++){const b=C.blocks[i];const L=snSplit($('#sncv'+i).value);
    if(!Number.isInteger(b.q)){err.textContent=`В документе ${docNo(b.o)} дробное количество — серийный учёт невозможен`;return}

/* ---------- отчёт поставщику по реализации ---------- */
function consReport(sid){const s=S.set;const sc=can('cost');const rs=consRows().filter(r=>r.supp===sid).sort((a,b)=>pname(a.p).localeCompare(pname(b.p),'ru'));
  const ls=(S.consLots||[]).filter(l=>l.supp===sid);
  const cols=[['№',.05,'q'],['Товар',.29],['Взято',.08,'q'],['Продано',.09,'q'],['Возвращено',.10,'q'],['Остаток',.09,'q'],...(sc?[['Цена',.10,'m'],['Сумма продано',.10,'m'],['Сумма остатка',.10,'m']]:[])];
  if(!sc){cols[1][1]=.59}
  const rows=rs.map((r,i)=>{const sns=ls.filter(l=>l.p===r.p&&l.serial).flatMap(l=>[...l.left]);const price=r.q?r.val/r.q:0;
    return{cells:[i+1,pname(r.p),r.q,r.sold,r.ret,r.rem,...(sc?[price,r.sum,r.remv]:[])],note:sns.length?'S/N остатка: '+sns.join(', '):''}});
  const t=k=>rs.reduce((a,r)=>a+r[k],0);
  rows.push({bold:true,cells:['','Итого',t('q'),t('sold'),t('ret'),t('rem'),...(sc?['',t('sum'),t('remv')]:[])]});
  const pays=S.spays.filter(x=>x.supp===sid&&ls.length&&x.at>=ls[0].o.at).reduce((a,x)=>a+num(x.amount),0);
  const after=sc?[[`Продано товара на сумму: ${money(t('sum'))}`,true],[`Остаток на реализации на сумму: ${money(t('remv'))}`,false],[`Оплачено поставщику с начала реализации: ${money(pays)}`,false],[`Наш долг перед поставщиком на ${ds(now())}: ${money(supDebtOf(sid))}`,true]]:[];
  return{title:'ОТЧЁТ ПО ТОВАРУ НА РЕАЛИЗАЦИИ',sheet:'Реализация',shop:[s.shopName||'Магазин',s.shopAddr||'',s.shopPhone?'Тел.: '+s.shopPhone:''].filter(Boolean),
    sub:[`Поставщик: ${sname(sid)}`,`по состоянию на ${dt(now())}`],cols,rows,after,signs:['Сдал (магазин)','Принял (поставщик)']}}
async function consDl(sid,f){try{const d=consReport(sid);const nm=`Реализация ${sname(sid)} на ${ds(now())}`.replace(/[\\/:*?"<>|]/g,' ');

  const tens=['','','двадцать','тридцать','сорок','пятьдесят','шестьдесят','семьдесят','восемьдесят','девяносто'];
  const hund=['','сто','двести','триста','четыреста','пятьсот','шестьсот','семьсот','восемьсот','девятьсот'];

function commCalc(rg){const res={};const st=S.staffL.filter(x=>num(x.pct)>0);if(!st.length)return[];const ids=new Set(st.map(x=>x.id));
  const byId={};for(const o of S.sales)byId[o.id]=o;
  for(const o of S.sales){if(!inR(o,rg))continue;
    if(o.type==='sale'&&ids.has(o.by)){const r=res[o.by]??={n:0,rev:0,cogs:0,ret:0};r.n++;r.rev+=num(o.total);r.cogs+=(o.items||[]).reduce((a,i,k)=>a+num(i.q)*icost(o,k),0)}
    else if(o.type==='ret'){const so=byId[o.sale];const who=so?.by;if(!ids.has(who))continue;const r=res[who]??={n:0,rev:0,cogs:0,ret:0};const dc=(o.items||[]).reduce((a,i,k)=>a+num(i.q)*icost(o,k),0);r.rev-=num(o.total);if(o.restock)r.cogs-=dc;r.ret++}}
  const pk=`${rg.from.toISOString().slice(0,10)}_${rg.to.toISOString().slice(0,10)}`;
  return st.map(x=>{const r=res[x.id]||{n:0,rev:0,cogs:0,ret:0};const margin=r.rev-r.cogs;const sum=r2(Math.max(0,margin)*num(x.pct)/100);
    const paid=S.moneyL.filter(m=>m.kind==='out'&&m.staff===x.id&&m.per===pk).reduce((a,m)=>a+num(m.amount),0);return{x,...r,margin,sum,paid,pk}})}

  if(!L.length)return `<section class="pane"><div class="pane-h"><h2>Процент продавцам</h2></div><p class="muted small">Если продавец получает процент от маржи, укажите процент в «Настройки» → сотрудник → «Процент от маржи». Здесь появится расчёт за выбранный период.</p></section>`;
  return `<section class="pane"><div class="pane-h"><h2>Процент продавцам за период</h2><span class="muted small">маржа = выручка − себестоимость проданного, за вычетом возвратов</span></div>
  <div class="tbl"><table><thead><tr><th>Сотрудник</th><th class="num">Продаж</th><th class="num">Выручка</th><th class="num">Себестоимость</th><th class="num">Маржа</th><th class="num">%</th><th class="num">К начислению</th><th class="num">Выплачено</th><th></th></tr></thead><tbody>

   <td style="white-space:nowrap;text-align:right">${left>0.004?`<button class="btn ghost" style="padding:5px 12px" data-act="comm-pay" data-id="${esc(r.x.id)}" data-amt="${left}" data-pk="${esc(r.pk)}">Начислить и выплатить</button>`:r.sum>0?'<span class="chip ok">выплачено</span>':''} <button class="btn link" data-act="comm-list" data-id="${esc(r.x.id)}">Продажи</button></td></tr>`}).join('')}</tbody></table></div>
  <p class="muted small" style="margin-top:6px">Продажа засчитывается тому сотруднику, кто провёл её в кассе или оформил накладную. Выплата записывается расходом «Зарплата» и уменьшает прибыль.</p></section>`}

function cartAdd(pid,sn){const p=S.P[pid];if(!p)return;
  if(sn&&S.pca[sn]){if(S.cart.some(l=>(l.sn||[]).includes(sn))){toast('Этот компьютер уже в чеке');return}S.cart.push({p:pid,q:1,price:pcPrice(sn),disc:'',sn:[sn]});$('#cart').innerHTML=cartHtml();updCart();return}
  if(p.serial){let i=isPcProd(p)?-1:S.cart.findIndex(l=>l.p===pid);
    if(sn&&S.cart.some(l=>(l.sn||[]).includes(sn))){toast('Этот номер уже в чеке');return}
    if(sn&&S.pca[sn]){S.cart.push({p:pid,q:1,price:pcPrice(sn),disc:'',sn:[sn]});$('#cart').innerHTML=cartHtml();updCart();return}
    if(sn){if(i<0){S.cart.push({p:pid,q:0,price:num(p.sellPrice),disc:'',sn:[]});i=S.cart.length-1}const l=S.cart[i];if(!l.sn.includes(sn)){l.sn.push(sn);l.q=l.sn.length}$('#cart').innerHTML=cartHtml();updCart();return}
    if(!snAt(S.curWh,pid).length){toast('На этом складе нет номеров этого товара');return}
    let isNew=false;if(i<0){S.cart.push({p:pid,q:0,price:num(p.sellPrice),disc:'',sn:[]});i=S.cart.length-1;isNew=true}
    $('#cart').innerHTML=cartHtml();updCart();snOpen('cart',i,isNew);return}
  const l=S.cart.find(l=>l.p===pid);if(l)l.q=r3(num(l.q)+1);else S.cart.push({p:pid,q:1,price:num(p.sellPrice),disc:''});$('#cart').innerHTML=cartHtml();updCart()}

plchk:t=>{plCfg()[t.dataset.f]=t.checked;render()},
plcol:t=>{plCfg().cols[t.dataset.f]=t.checked},
plstock:t=>{plCfg().cols.stock=t.value},
plinc:t=>{const c=plCfg();c.ex=c.ex.filter(x=>x!==t.value);if(!t.checked)c.ex.push(t.value);render()},

document.addEventListener('click',e=>{const t=e.target.closest('[data-act]');if(!t||t.disabled)return;const f=ACT[t.dataset.act];if(f){e.preventDefault();f(t,e)}});
document.addEventListener('input',e=>{if(e.target.id==='snTxt')return snCount();const f=IN[e.target.dataset?.in];if(f)f(e.target)});
document.addEventListener('change',e=>{const f=CH[e.target.dataset?.ch];if(f)f(e.target)});
document.addEventListener('keydown',e=>{if(e.key!=='Enter')return;const id=e.target.id;
  if(id==='newWh')ACT['wh-add']();if(id==='newWhOnb')ACT['wh-add-onb']();
  if(id==='asmQ'){const b=$('#asmRes button[data-act="asm-add"]');if(b){e.preventDefault();b.click()}}
  if(id==='opQ'){const b=$('#opRes button[data-act="op-add"]');if(b){e.preventDefault();b.click()}}
  if(id==='saleQ'){e.preventDefault();const q=S.saleQ.trim();if(!q)return;const hit=S.snLoc[q];
    if(hit&&hit.wh===S.curWh){cartAdd(hit.p,q);clearSaleQ();return}
    const l=filterProds(q);const ex=l.find(p=>(p.sku||'').toLowerCase()===q.toLowerCase());const pick=ex||(l.length===1?l[0]:null);
    if(pick){if(!pick.serial)clearSaleQ();cartAdd(pick.id)}}
  if(id==='pf-gname'){e.preventDefault();ACT['pf-gadd']();return}
  if(e.target.closest?.('#mcard')&&e.target.tagName==='INPUT'){const b=$('#mcard [data-act="prod-save"],#mcard [data-act="wh-save"],#mcard [data-act="cust-save"],#mcard [data-act="pay-save"],#mcard [data-act="cl-save"],#mcard [data-act="grp-save"],#mcard [data-act="supp-save"],#mcard [data-act="spay-save"],#mcard [data-act="m-save"],#mcard [data-act="po-pay-save"]');if(b){e.preventDefault();b.click()}}});

/* ---------- запуск ---------- */
(async()=>{
  const C=window.claude;
  const [db,user]=C?await Promise.all([C.use('db'),C.use('user')]):[null,null];
  if(!db){S.offline=true;render();return}
  S.db=db;S.user=user;
  if(user){try{S.uid=await user.id();S.isOwner=!!(await user.isOwner());const ed=await user.canEdit();const cw=await user.can('data.write');
      S.role=(S.isOwner||ed)?'admin':cw===false?'view':'seller';
      const me=await user.me();S.meName=me?.name||'';S.meEmail=me?.email||''}catch(e){}}
  const fail=e=>{if(e?.code==='revoked'||e?.code==='not_granted'){S.offline=true;render()}};
  const mark=k=>{S.loaded.add(k);derive();scheduleRender()};
  const failK=k=>e=>{if(e?.code==='permission-denied'){mark(k);return}fail(e)};
  const sub=(col,key,sort)=>db.collection(col).onSnapshot(s=>{S[key]=s.docs.map(d=>({id:d.id,...d.data()})).sort(sort);mark(key)},failK(key));
  const byName=(a,b)=>(a.name||'').localeCompare(b.name||'','ru');
  S.need=9;if(S.role==='admin')S.need=15;if(S.isOwner)S.need=16;
  sub('warehouses','wh',byName);sub('products','prod',byName);sub('customers','cust',byName);sub('groups','groups',byName);sub('staff','staffL',()=>0);sub('claims','claims',(a,b)=>(b.at||'').localeCompare(a.at||''));
  sub('ops','ops',(a,b)=>(b.at||'').localeCompare(a.at||''));sub('sales','sales',(a,b)=>(b.at||'').localeCompare(a.at||''));
  if(S.isOwner)sub('seen','seenL',()=>0);
  if(S.role==='admin'){sub('costs','costsL',()=>0);sub('opcosts','opcL',()=>0);sub('suppliers','supp',byName);sub('suppays','spays',(a,b)=>(b.at||'').localeCompare(a.at||''));sub('money','moneyL',(a,b)=>(b.at||'').localeCompare(a.at||''));sub('pos','posL',(a,b)=>(b.at||'').localeCompare(a.at||''))}
  db.doc('settings/main').onSnapshot(s=>{S.set={newPolicy:'pending',shopName:'',shopAddr:'',shopPhone:'',wTerms:'',...(s.exists?s.data():{})};mark('set')},failK('set'));
  if(!S.isOwner&&S.uid&&S.role!=='view'){const ref=db.doc('seen/'+S.uid);ref.get().then(sn=>{const d=sn.exists?sn.data():null;if(!d||d.lvl!==S.role||(SRV()&&d.name!==S.meName)||Date.now()-new Date(d.at)>864e5)return ref.set({at:now(),lvl:S.role,...(SRV()?{name:S.meName,email:S.meEmail}:{})})}).catch(()=>{})}
})();
